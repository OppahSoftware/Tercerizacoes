<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Terceirizações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #0f172a; /* slate-900 */
        }
        
        /* Estilização da barra de rolagem para combinar com o tema */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Fixar o cabeçalho da tabela */
        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar Oppah -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl leading-none">
                        Op
                    </div>
                    <span class="font-semibold text-lg tracking-wide">Portal Oppah</span>
                    <span class="ml-4 px-3 py-1 bg-slate-800 text-slate-300 text-sm rounded-full border border-slate-700">Módulo: Terceirizados</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Container Principal Dinâmico -->
    <main class="flex-grow max-w-full px-4 sm:px-6 lg:px-8 py-8" id="app-container">
        <!-- O conteúdo será renderizado aqui pelo JavaScript -->
    </main>

    <!-- Modal Base (Substitui alerts e prompts) -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="modal-content-box">
            <div class="p-6">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900 mb-2">Título</h3>
                <div id="modal-body" class="text-sm text-slate-600 mb-6">
                    Mensagem
                </div>
                <div id="modal-input-container" class="mb-6 hidden">
                    <input type="text" id="modal-input" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                </div>
                <div class="flex justify-end gap-3">
                    <button id="modal-cancel-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-sm font-medium transition-colors">Cancelar</button>
                    <button id="modal-confirm-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium transition-colors">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração do PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Base de Dados em Memória (Inicia limpa conforme solicitado)
        let db = {
            terceirizados: [] 
        };

        // Estado da Navegação
        let currentView = 'dashboard'; // 'dashboard', 'terceirizado', 'obra'
        let currentTerceirizadoId = null;
        let currentObraId = null;

        // --- SISTEMA DE MODAL CUSTOMIZADO ---
        let modalConfirmCallback = null;

        function showModal(options) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const inputContainer = document.getElementById('modal-input-container');
            const inputEl = document.getElementById('modal-input');
            const cancelBtn = document.getElementById('modal-cancel-btn');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            titleEl.innerText = options.title || 'Aviso';
            bodyEl.innerHTML = options.message || '';
            confirmBtn.innerText = options.confirmText || 'Confirmar';
            confirmBtn.className = `px-4 py-2 rounded-md text-sm font-medium transition-colors text-white ${options.confirmColor || 'bg-blue-600 hover:bg-blue-700'}`;

            if (options.type === 'prompt') {
                inputContainer.classList.remove('hidden');
                inputEl.value = options.defaultValue || '';
                setTimeout(() => inputEl.focus(), 100);
            } else {
                inputContainer.classList.add('hidden');
            }

            if (options.hideCancel) {
                cancelBtn.classList.add('hidden');
            } else {
                cancelBtn.classList.remove('hidden');
            }

            modalConfirmCallback = () => {
                const val = inputEl.value;
                closeModal();
                if (options.onConfirm) options.onConfirm(val);
            };

            // Mostrar modal
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content-box').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('opacity-0');
            document.getElementById('modal-content-box').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
        document.getElementById('modal-confirm-btn').addEventListener('click', () => {
            if(modalConfirmCallback) modalConfirmCallback();
        });


        // --- FUNÇÕES DE NAVEGAÇÃO E RENDERIZAÇÃO ---
        
        function renderDashboard() {
            currentView = 'dashboard';
            const container = document.getElementById('app-container');
            
            let html = `
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800">Terceirizados</h1>
                        <p class="text-slate-500 text-sm mt-1">Gerencie seus prestadores de serviço e pagamentos.</p>
                    </div>
                    <button onclick="adicionarTerceirizado()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Novo Terceirizado
                    </button>
                </div>
            `;

            if (db.terceirizados.length === 0) {
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 mb-4">
                            <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        </div>
                        <h3 class="text-lg font-medium text-slate-900">Nenhum terceirizado cadastrado</h3>
                        <p class="text-slate-500 mt-1 mb-6">Comece adicionando o seu primeiro parceiro para gerenciar as obras.</p>
                        <button onclick="adicionarTerceirizado()" class="text-blue-600 hover:text-blue-700 font-medium">Cadastrar agora &rarr;</button>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                db.terceirizados.forEach(t => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 hover:shadow-md transition-shadow cursor-pointer" onclick="abrirTerceirizado('${t.id}')">
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xl">
                                    ${t.nome.charAt(0).toUpperCase()}
                                </div>
                                <span class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded-md font-medium">${t.obras.length} Obra(s)</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800">${t.nome}</h3>
                            <p class="text-slate-500 text-sm mt-2">Clique para ver as ordens de serviço e pagamentos deste parceiro.</p>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        function abrirTerceirizado(id) {
            currentTerceirizadoId = id;
            currentView = 'terceirizado';
            const t = db.terceirizados.find(x => x.id === id);
            const container = document.getElementById('app-container');

            let html = `
                <div class="mb-6">
                    <button onclick="renderDashboard()" class="text-slate-500 hover:text-blue-600 flex items-center gap-1 text-sm font-medium transition-colors mb-4">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Voltar para Terceirizados
                    </button>
                    <div class="flex justify-between items-end">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800">${t.nome}</h1>
                            <p class="text-slate-500 text-sm mt-1">Obras e Ordens de Serviço vinculadas.</p>
                        </div>
                        <button onclick="adicionarObra()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2 text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Nova Obra
                        </button>
                    </div>
                </div>
            `;

            if (t.obras.length === 0) {
                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-10 text-center">
                        <p class="text-slate-500 mb-4">Nenhuma obra cadastrada para este parceiro.</p>
                        <button onclick="adicionarObra()" class="text-emerald-600 hover:text-emerald-700 font-medium">Criar primeira obra &rarr;</button>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                t.obras.forEach(o => {
                    // Calculo de total da obra para preview
                    let totalObra = o.itens ? o.itens.reduce((acc, item) => acc + (item.prod + item.inst), 0) : 0;
                    
                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:border-emerald-300 transition-colors cursor-pointer group" onclick="abrirObra('${o.id}')">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-1">OS #${o.numeroOS}</div>
                                    <h3 class="text-lg font-bold text-slate-800 group-hover:text-emerald-700 transition-colors">${o.nome}</h3>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm text-slate-500 mb-1">Total Previsto</div>
                                    <div class="font-bold text-slate-800">R$ ${totalObra.toFixed(2).replace('.', ',')}</div>
                                </div>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-sm text-slate-500">
                                <span>${o.itens ? o.itens.length : 0} Peças importadas</span>
                                <span class="text-blue-600 font-medium">Acessar Painel &rarr;</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        function abrirObra(id) {
            currentObraId = id;
            currentView = 'obra';
            const t = getTerceirizadoAtual();
            const o = getObraAtual();
            const container = document.getElementById('app-container');

            let html = `
                <div class="mb-6">
                    <button onclick="abrirTerceirizado('${t.id}')" class="text-slate-500 hover:text-blue-600 flex items-center gap-1 text-sm font-medium transition-colors mb-4">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Voltar para ${t.nome}
                    </button>
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="inline-block px-2 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded mb-2">OS #${o.numeroOS}</div>
                            <h1 class="text-2xl font-bold text-slate-800">Obra: ${o.nome}</h1>
                        </div>
                    </div>
                </div>

                <!-- Painéis de Importação (Passo 1 e 2) -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                    <!-- PASSO 1: PDF -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                            <span class="bg-blue-600 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">1</span>
                            Extração do PDF (Medidas)
                        </h3>
                        <p class="text-sm text-slate-500 mb-4">Carregue o croqui para extrair as peças e metragens.</p>
                        <div class="flex items-center gap-3">
                            <input type="file" id="pdf-upload" accept="application/pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-md">
                            <button onclick="importarPDF()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium text-sm whitespace-nowrap transition-colors">Ler PDF</button>
                        </div>
                        <div id="status-pdf" class="mt-3 text-sm text-slate-600 h-5"></div>
                    </div>

                    <!-- PASSO 2: WhatsApp -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                            <span class="bg-emerald-600 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">2</span>
                            Valores (WhatsApp)
                        </h3>
                        <p class="text-sm text-slate-500 mb-2">Cole os valores negociados para cruzar com o PDF.</p>
                        <div class="flex flex-col gap-2">
                            <textarea id="wpp-upload" rows="2" placeholder="Ex: Item 1 = Prod 350 / Inst 350..." class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-emerald-500 focus:border-emerald-500"></textarea>
                            <div class="flex justify-between items-center">
                                <div id="status-wpp" class="text-sm text-slate-600"></div>
                                <button onclick="importarWPP()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md font-medium text-sm transition-colors">Cruzar Valores</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Resumo Financeiro -->
                <div class="bg-slate-800 rounded-xl shadow-sm p-6 mb-8 text-white grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div>
                        <div class="text-slate-400 text-sm font-medium mb-1">Total da Obra</div>
                        <div class="text-2xl font-bold" id="resumo-total">R$ 0,00</div>
                    </div>
                    <div>
                        <div class="text-slate-400 text-sm font-medium mb-1">Limite Vales (30%)</div>
                        <div class="text-2xl font-bold text-amber-400" id="resumo-limite">R$ 0,00</div>
                    </div>
                    <div>
                        <div class="text-slate-400 text-sm font-medium mb-1">Vales Já Pagos</div>
                        <div class="text-2xl font-bold text-emerald-400" id="resumo-vales">R$ 0,00</div>
                    </div>
                </div>

                <!-- Tabela Complexa de Apontamento -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                        <h3 class="font-semibold text-slate-800">Apontamento, Custos e Liberações</h3>
                    </div>
                    <!-- Container com rolagem e altura máxima -->
                    <div class="overflow-x-auto overflow-y-auto w-full max-h-[600px]">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-100 text-slate-600 font-medium text-xs uppercase tracking-wider sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3 border-b border-r border-slate-200 bg-slate-100 text-center">ID</th>
                                    <th class="px-4 py-3 border-b border-r border-slate-200 bg-slate-100 min-w-[250px]">Descrição da Peça</th>
                                    <th class="px-4 py-3 border-b border-r border-slate-200 bg-slate-100 text-center">m²</th>
                                    <th class="px-4 py-3 border-b border-r border-slate-200 bg-blue-50 text-blue-800 text-center" colspan="3">Produção</th>
                                    <th class="px-4 py-3 border-b border-r border-slate-200 bg-emerald-50 text-emerald-800 text-center" colspan="3">Instalação</th>
                                    <th class="px-4 py-3 border-b border-slate-200 bg-slate-100 text-center" colspan="3">Totais e Geral</th>
                                </tr>
                                <tr>
                                    <!-- Sub-headers -->
                                    <th class="px-2 py-2 border-b border-r border-slate-200 bg-slate-50"></th>
                                    <th class="px-2 py-2 border-b border-r border-slate-200 bg-slate-50"></th>
                                    <th class="px-2 py-2 border-b border-r border-slate-200 bg-slate-50"></th>
                                    
                                    <!-- Prod -->
                                    <th class="px-2 py-2 border-b border-slate-200 bg-white">Valor</th>
                                    <th class="px-2 py-2 border-b border-slate-200 bg-white text-slate-400">R$/m²</th>
                                    <th class="px-2 py-2 border-b border-r border-slate-200 bg-white">Ação</th>
                                    
                                    <!-- Inst -->
                                    <th class="px-2 py-2 border-b border-slate-200 bg-white">Valor</th>
                                    <th class="px-2 py-2 border-b border-slate-200 bg-white text-slate-400">R$/m²</th>
                                    <th class="px-2 py-2 border-b border-r border-slate-200 bg-white">Ação</th>
                                    
                                    <!-- Total -->
                                    <th class="px-2 py-2 border-b border-slate-200 bg-slate-50">Subtotal</th>
                                    <th class="px-2 py-2 border-b border-slate-200 bg-slate-50">R$/m² Total</th>
                                    <th class="px-2 py-2 border-b border-slate-200 bg-slate-50 text-center">Obs</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-corpo-obra" class="divide-y divide-slate-100">
                                <!-- Linhas renderizadas aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            
            atualizarResumoObra();
            renderTabelaObra();
        }

        
        function getTerceirizadoAtual() {
            return db.terceirizados.find(t => t.id === currentTerceirizadoId);
        }

        function getObraAtual() {
            const t = getTerceirizadoAtual();
            if (!t) return null;
            return t.obras.find(o => o.id === currentObraId);
        }

        function adicionarTerceirizado() {
            showModal({
                title: 'Novo Terceirizado',
                message: 'Digite o nome ou razão social do prestador:',
                type: 'prompt',
                onConfirm: (nome) => {
                    if (nome && nome.trim() !== '') {
                        const newId = 't_' + Date.now();
                        db.terceirizados.push({
                            id: newId,
                            nome: nome.trim(),
                            obras: []
                        });
                        renderDashboard();
                    }
                }
            });
        }

        function adicionarObra() {
            showModal({
                title: 'Nova Obra',
                message: 'Digite o número da OS e o Nome da Obra (Ex: 461 - Jean Camargo):',
                type: 'prompt',
                onConfirm: (val) => {
                    if (val && val.trim() !== '') {
                        const t = getTerceirizadoAtual();
                        const parts = val.split('-');
                        const num = parts[0] ? parts[0].trim() : 'S/N';
                        const nome = parts[1] ? parts[1].trim() : val.trim();
                        
                        t.obras.push({
                            id: 'o_' + Date.now(),
                            numeroOS: num,
                            nome: nome,
                            valesPagos: 0,
                            itens: []
                        });
                        abrirTerceirizado(t.id);
                    }
                }
            });
        }

        // PASSO 1: IMPORTAR PDF
        async function importarPDF() {
            const fileInput = document.getElementById('pdf-upload');
            const statusEl = document.getElementById('status-pdf');

            if (fileInput.files.length === 0) {
                showModal({ title: 'Atenção', message: 'Selecione o arquivo PDF da Ordem de Serviço.', hideCancel: true });
                return;
            }

            statusEl.innerHTML = '<span class="text-blue-500 animate-pulse">Lendo PDF...</span>';

            const file = fileInput.files[0];
            const fileReader = new FileReader();

            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let textoCompleto = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    textoCompleto += textContent.items.map(item => item.str).join(' ') + ' ';
                }

                // Simulação da extração de PDF (Metragens e IDs sem preços)
                // Usando 9 itens para habilitar a barra de rolagem
                const obra = getObraAtual();
                obra.itens = [
                    { id: '1', desc: 'PORTA DE GIRO 01 FOLHA | LINHA 42', m2: 2.84, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '2.1', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', m2: 1.28, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '2.2', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', m2: 1.28, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '3.1', desc: 'JANELA DE CORRER INTEGRADA 02 FOLHAS', m2: 3.81, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '3.2', desc: 'JANELA DE CORRER INTEGRADA 02 FOLHAS', m2: 3.81, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '4', desc: 'PORTA DE CORRER 03 FOLHAS', m2: 4.24, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '5', desc: 'PORTA DE CORRER 02 FOLHAS MÓVEIS | GOLD', m2: 3.23, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '6', desc: 'JANELA DE CORRER 04 FOLHAS | GOLD', m2: 2.00, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' },
                    { id: '7', desc: 'MAXIM-AR E FIXO COM 02 MÓDULOS', m2: 5.84, prod: 0, inst: 0, obs: '', statusProd: '', statusInst: '' }
                ];
                
                statusEl.innerHTML = `<span class="text-emerald-600 font-medium">✓ PDF lido! ${obra.itens.length} peças extraídas (R$ zerados).</span>`;
                atualizarResumoObra();
                renderTabelaObra();
            };
            fileReader.readAsArrayBuffer(file);
        }

        // PASSO 2: CRUZAR VALORES WPP
        function importarWPP() {
            const txt = document.getElementById('wpp-upload').value;
            const statusEl = document.getElementById('status-wpp');
            const obra = getObraAtual();

            if (!obra.itens || obra.itens.length === 0) {
                showModal({ title: 'Erro de Fluxo', message: 'Você precisa importar o PDF (Passo 1) antes de cruzar os valores.', hideCancel: true });
                return;
            }
            if (txt.trim() === '') {
                showModal({ title: 'Atenção', message: 'Cole o texto do WhatsApp na caixa antes de processar.', hideCancel: true });
                return;
            }

            // Simulação de Inteligência de cruzamento
            // Na vida real, aplicariamos RegEx no 'txt'
            obra.itens[0].prod = 350; obra.itens[0].inst = 350; // Item 1
            obra.itens[1].prod = 120; obra.itens[1].inst = 200; // 2.1
            obra.itens[2].prod = 120; obra.itens[2].inst = 200; // 2.2
            obra.itens[3].prod = 350; obra.itens[3].inst = 300; // 3.1
            obra.itens[4].prod = 350; obra.itens[4].inst = 300; // 3.2
            obra.itens[5].prod = 350; obra.itens[5].inst = 350; // 4
            obra.itens[6].prod = 250; obra.itens[6].inst = 260; // 5
            obra.itens[7].prod = 180; obra.itens[7].inst = 200; // 6
            obra.itens[8].prod = 350; obra.itens[8].inst = 350; // 7
            
            statusEl.innerHTML = `<span class="text-emerald-600 font-medium">✓ Valores cruzados com sucesso!</span>`;
            document.getElementById('wpp-upload').value = ''; // limpa
            
            atualizarResumoObra();
            renderTabelaObra();
        }

        function formatMoney(val) {
            return 'R$ ' + val.toFixed(2).replace('.', ',');
        }

        function atualizarResumoObra() {
            const obra = getObraAtual();
            if (!obra) return;

            let total = 0;
            if (obra.itens) {
                total = obra.itens.reduce((acc, it) => acc + (it.prod + it.inst), 0);
            }
            const limite = total * 0.30;

            document.getElementById('resumo-total').innerText = formatMoney(total);
            document.getElementById('resumo-limite').innerText = formatMoney(limite);
            document.getElementById('resumo-vales').innerText = formatMoney(obra.valesPagos || 0);
        }

        function renderTabelaObra() {
            const obra = getObraAtual();
            const tbody = document.getElementById('tabela-corpo-obra');
            if (!obra || !obra.itens || obra.itens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="px-4 py-8 text-center text-slate-500">Faça o upload do PDF no Passo 1 para extrair os itens da obra.</td></tr>`;
                return;
            }

            let html = '';
            obra.itens.forEach((it, idx) => {
                // Matemáticas de m2
                let pm2 = it.m2 > 0 ? (it.prod / it.m2) : 0;
                let im2 = it.m2 > 0 ? (it.inst / it.m2) : 0;
                let sub = it.prod + it.inst;
                let tm2 = it.m2 > 0 ? (sub / it.m2) : 0;

                // Controles de Status Produção
                let prodActionHtml = '';
                if (it.prod === 0) {
                    prodActionHtml = `<span class="text-xs text-slate-400">Aguardando Valor</span>`;
                } else if (it.statusProd === 'Pago') {
                    prodActionHtml = `<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs font-bold w-full inline-block text-center">✓ Pago</span>`;
                } else {
                    prodActionHtml = `
                        <div class="flex items-center gap-1">
                            <input type="date" id="dp_${idx}" class="w-24 px-1 py-1 border border-slate-300 rounded text-xs" onchange="checkDate(${idx}, 'prod')">
                            <button id="bp_${idx}" disabled onclick="pagar(${idx}, 'prod')" class="bg-blue-600 disabled:bg-slate-300 text-white px-2 py-1 rounded text-xs font-bold transition-colors w-14">Pagar</button>
                        </div>
                    `;
                }

                // Controles de Status Instalação
                let instActionHtml = '';
                if (it.inst === 0) {
                    instActionHtml = `<span class="text-xs text-slate-400">Aguardando Valor</span>`;
                } else if (it.statusInst === 'Pago') {
                    instActionHtml = `<span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-xs font-bold w-full inline-block text-center">✓ Pago</span>`;
                } else {
                    instActionHtml = `
                        <div class="flex items-center gap-1">
                            <input type="date" id="di_${idx}" class="w-24 px-1 py-1 border border-slate-300 rounded text-xs" onchange="checkDate(${idx}, 'inst')">
                            <button id="bi_${idx}" disabled onclick="pagar(${idx}, 'inst')" class="bg-emerald-600 disabled:bg-slate-300 text-white px-2 py-1 rounded text-xs font-bold transition-colors w-14">Pagar</button>
                        </div>
                    `;
                }

                html += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-4 py-3 border-r border-slate-100 font-bold text-slate-700 text-center">${it.id}</td>
                        <td class="px-4 py-3 border-r border-slate-100 text-slate-600 truncate max-w-[250px]" title="${it.desc}">${it.desc}</td>
                        <td class="px-4 py-3 border-r border-slate-100 font-medium text-slate-700 text-center">${it.m2.toFixed(2)}</td>
                        
                        <!-- Produção -->
                        <td class="px-2 py-3 border-slate-100 font-medium text-slate-800">${formatMoney(it.prod)}</td>
                        <td class="px-2 py-3 border-slate-100 text-slate-400 text-xs">${formatMoney(pm2)}</td>
                        <td class="px-2 py-3 border-r border-slate-100">${prodActionHtml}</td>

                        <!-- Instalação -->
                        <td class="px-2 py-3 border-slate-100 font-medium text-slate-800">${formatMoney(it.inst)}</td>
                        <td class="px-2 py-3 border-slate-100 text-slate-400 text-xs">${formatMoney(im2)}</td>
                        <td class="px-2 py-3 border-r border-slate-100">${instActionHtml}</td>

                        <!-- Totais e Obs -->
                        <td class="px-4 py-3 border-slate-100 font-bold text-slate-800 bg-slate-50/50">${formatMoney(sub)}</td>
                        <td class="px-4 py-3 border-slate-100 font-bold text-slate-500 bg-slate-50/50">${formatMoney(tm2)}</td>
                        <td class="px-2 py-3 text-center bg-slate-50/50">
                            <button onclick="editarObs(${idx})" class="${it.obs ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'} hover:bg-slate-200 px-2 py-1 rounded-md text-xs font-medium transition-colors" title="${it.obs || 'Adicionar observação'}">
                                ${it.obs ? '📝 Ler' : '+ Obs'}
                            </button>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function checkDate(idx, tipo) {
            // Gatilho que libera o botão de pagar
            if (tipo === 'prod') {
                const val = document.getElementById(`dp_${idx}`).value;
                document.getElementById(`bp_${idx}`).disabled = !val;
            } else {
                const val = document.getElementById(`di_${idx}`).value;
                document.getElementById(`bi_${idx}`).disabled = !val;
            }
        }

        function pagar(idx, tipo) {
            const obra = getObraAtual();
            const it = obra.itens[idx];
            const valor = tipo === 'prod' ? it.prod : it.inst;
            const etapa = tipo === 'prod' ? 'Produção' : 'Instalação';

            showModal({
                title: 'Confirmar Pagamento',
                message: `Deseja registrar o pagamento de <strong>${formatMoney(valor)}</strong> referente à ${etapa} do Item ${it.id}?<br><br><span class="text-xs text-slate-500">O sistema abaterá eventuais vales vinculados a esta obra automaticamente.</span>`,
                confirmText: 'Confirmar Pagamento',
                confirmColor: tipo === 'prod' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-emerald-600 hover:bg-emerald-700',
                onConfirm: () => {
                    if (tipo === 'prod') it.statusProd = 'Pago';
                    if (tipo === 'inst') it.statusInst = 'Pago';
                    renderTabelaObra();
                }
            });
        }

        function editarObs(idx) {
            const obra = getObraAtual();
            const it = obra.itens[idx];

            showModal({
                title: `Observações - Item ${it.id}`,
                message: 'Adicione notas técnicas, reparos ou detalhes sobre este item:',
                type: 'prompt',
                defaultValue: it.obs,
                confirmText: 'Salvar',
                onConfirm: (novaObs) => {
                    it.obs = novaObs;
                    renderTabelaObra();
                }
            });
        }

        // Init App
        renderDashboard();

    </script>
</body>
</html>
