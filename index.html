<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Terceirizações</title>
    
    <script>
        tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Inter', 'sans-serif'],
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        /* Custom Scrollbar for the table */
        .table-container { max-height: 500px; overflow-y: auto; }
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: transparent; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .table-container::-webkit-scrollbar-thumb { background: #475569; }
        
        .sticky-header th { position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }

        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }

        /* Estilos específicos e limpos para Impressão */
        @media print {
            @page { margin: 1cm; }
            body { background-color: #fff !important; }
            /* Esconde menus, modais e elementos marcados como no-print */
            nav, #modal-container, .no-print, button { display: none !important; }
            /* Remove a barra de rolagem da tabela para imprimir todas as linhas */
            .table-container { max-height: none !important; overflow: visible !important; }
            .sticky-header th { position: static !important; }
            main { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
            /* Remove a borda dos inputs de data para ficar como texto limpo na impressão */
            input[type="date"] { border: none !important; background: transparent !important; padding: 0 !important; color: #000 !important; pointer-events: none; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col transition-colors duration-200">

    <nav class="bg-slate-900 dark:bg-slate-950 border-b border-slate-800 dark:border-slate-900 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-emerald-500 text-white p-1.5 rounded-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                    <span class="font-bold text-xl text-white tracking-tight">Portal <span class="text-emerald-400">Oppah</span></span>
                    <span class="text-slate-400 text-sm ml-2 hidden sm:block border-l border-slate-700 pl-3">Módulo de Terceirizações</span>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Botão de Dark Mode -->
                    <button id="theme-toggle" onclick="toggleDarkMode()" class="text-slate-400 hover:text-white transition-colors p-2 rounded-full bg-slate-800 dark:bg-slate-900 border border-slate-700">
                        <!-- Icon toggled via JS -->
                    </button>
                    <div id="nav-actions">
                        <!-- Dynamic nav actions -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="app-container">
            <!-- App content rendered via JS -->
        </div>
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // Configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // In-Memory Database (Starts empty)
        let db = { parceiros: [] };
        let currentParceiroId = null;
        let currentObraId = null;

        // Utilities
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const html = document.documentElement;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById('theme-toggle');
            if(btn) {
                btn.innerHTML = isDark 
                    ? `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`
                    : `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`;
            }
        }

        // Print Event Listeners to handle Dark Mode appropriately on paper
        window.addEventListener('beforeprint', () => { document.documentElement.classList.remove('dark'); });
        window.addEventListener('afterprint', () => { initTheme(); });

        function showModal({ title, html, confirmText = 'Confirmar', cancelText = 'Cancelar', onConfirm }) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-slate-900/60 backdrop-blur-sm p-4 md:p-0">
                    <div class="relative w-full max-w-md max-h-full">
                        <div class="relative bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-100 dark:border-slate-700 flex flex-col max-h-[90vh]">
                            <div class="flex items-center justify-between p-4 md:p-5 border-b border-slate-100 dark:border-slate-700 rounded-t">
                                <h3 class="text-lg font-bold text-slate-800 dark:text-white">${title}</h3>
                                <button type="button" onclick="closeModal()" class="text-slate-400 bg-transparent hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center">
                                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
                                </button>
                            </div>
                            <div class="p-4 md:p-5 overflow-y-auto">
                                ${html}
                            </div>
                            <div class="flex items-center p-4 md:p-5 border-t border-slate-100 dark:border-slate-700 rounded-b gap-3 bg-slate-50 dark:bg-slate-900/50">
                                <button id="modal-confirm" class="text-white bg-emerald-600 hover:bg-emerald-700 focus:ring-4 focus:outline-none focus:ring-emerald-300 dark:focus:ring-emerald-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center flex-1">${confirmText}</button>
                                <button onclick="closeModal()" class="text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 focus:ring-4 focus:outline-none focus:ring-slate-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center flex-1">${cancelText}</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-confirm').onclick = () => { if (onConfirm) onConfirm(); };
        }

        function showAlert(title, message, isSuccess = false) {
            const icon = isSuccess 
                ? `<div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-emerald-100 dark:bg-emerald-900/50 mb-4"><svg class="h-6 w-6 text-emerald-600 dark:text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>`
                : `<div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 dark:bg-blue-900/50 mb-4"><svg class="h-6 w-6 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>`;
            
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center overflow-y-auto overflow-x-hidden bg-slate-900/60 backdrop-blur-sm p-4">
                    <div class="relative p-4 w-full max-w-sm max-h-full">
                        <div class="relative bg-white dark:bg-slate-800 rounded-xl shadow-2xl p-6 text-center border border-slate-200 dark:border-slate-700">
                            ${icon}
                            <h3 class="mb-2 text-lg font-bold text-slate-800 dark:text-white">${title}</h3>
                            <p class="mb-6 text-sm text-slate-500 dark:text-slate-400">${message}</p>
                            <button onclick="closeModal()" class="text-white bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 focus:ring-4 focus:outline-none focus:ring-slate-300 font-medium rounded-lg text-sm inline-flex items-center px-5 py-2.5 text-center w-full justify-center">
                                OK, Entendi
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

        // Navigation Controllers
        function voltarParaDashboard() { currentParceiroId = null; currentObraId = null; renderDashboard(); }
        function voltarParaParceiro() { currentObraId = null; renderParceiro(currentParceiroId); }

        function renderDashboard() {
            const container = document.getElementById('app-container');
            const navActions = document.getElementById('nav-actions');
            
            navActions.innerHTML = `<button onclick="adicionarParceiro()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-sm flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Novo Terceirizado</button>`;

            let html = `
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Gestão de Parceiros</h2>
                    <p class="text-slate-500 dark:text-slate-400 mt-1">Selecione um terceirizado para gerenciar suas obras e pagamentos.</p>
                </div>
            `;

            if (db.parceiros.length === 0) {
                html += `
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-12 text-center max-w-2xl mx-auto mt-10">
                        <div class="bg-slate-50 dark:bg-slate-900 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100 dark:border-slate-700">
                            <svg class="w-8 h-8 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 dark:text-white mb-2">Nenhum parceiro cadastrado</h3>
                        <p class="text-slate-500 dark:text-slate-400 mb-6">O sistema está limpo. Comece cadastrando o seu primeiro prestador de serviço (ex: Gabriel P&P) para organizar os pagamentos.</p>
                        <button onclick="adicionarParceiro()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-6 rounded-lg shadow-sm transition-colors inline-flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg> Cadastrar Primeiro Parceiro
                        </button>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                db.parceiros.forEach(p => {
                    html += `
                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 hover:shadow-md dark:hover:border-emerald-600 transition-all cursor-pointer group" onclick="abrirParceiro('${p.id}')">
                            <div class="flex items-start justify-between mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-12 rounded-full bg-emerald-100 dark:bg-emerald-900/50 flex items-center justify-center text-emerald-700 dark:text-emerald-400 font-bold text-xl">
                                        ${p.empresa.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">${p.empresa}</h3>
                                        <p class="text-sm text-slate-500 dark:text-slate-400">${p.obras ? p.obras.length : 0} obras ativas</p>
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-2 mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                                <div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
                                    <svg class="w-4 h-4 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    ${p.responsavel}
                                </div>
                                <div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
                                    <svg class="w-4 h-4 text-slate-400 dark:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    ${p.telefone}
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function abrirParceiro(id) { currentParceiroId = id; renderParceiro(id); }

        function renderParceiro(id) {
            const t = db.parceiros.find(p => p.id === id);
            const container = document.getElementById('app-container');
            const navActions = document.getElementById('nav-actions');
            
            navActions.innerHTML = `<button onclick="adicionarObra()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-sm flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Nova Obra</button>`;

            let html = `
                <div class="mb-6 flex items-center gap-4">
                    <button onclick="voltarParaDashboard()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">${t.empresa}</h2>
                        <div class="flex items-center gap-3 text-sm text-slate-500 dark:text-slate-400 mt-1">
                            <span>PIX: <span class="font-medium text-slate-700 dark:text-slate-300">${t.pix}</span></span>
                            <span>&bull;</span>
                            <span>CNPJ/CPF: <span class="font-medium text-slate-700 dark:text-slate-300">${t.documento}</span></span>
                        </div>
                    </div>
                </div>
            `;

            if (!t.obras || t.obras.length === 0) {
                html += `
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-10 text-center max-w-xl mx-auto mt-8">
                        <div class="bg-emerald-50 dark:bg-emerald-900/30 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-emerald-500 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 dark:text-white mb-2">Nenhuma obra cadastrada</h3>
                        <p class="text-slate-500 dark:text-slate-400 mb-6">Cadastre a primeira obra deste parceiro para iniciar o controle de terceirização.</p>
                        <button onclick="adicionarObra()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-5 rounded-lg shadow-sm transition-colors">
                            Criar primeira obra
                        </button>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">`;
                t.obras.forEach(o => {
                    let totalObra = o.itens ? o.itens.reduce((acc, item) => acc + (item.prod + item.inst), 0) : 0;
                    
                    let prodQtdPaga = 0, prodQtdPendente = 0, prodValorPago = 0, prodValorPendente = 0;
                    let instQtdPaga = 0, instQtdPendente = 0, instValorPago = 0, instValorPendente = 0;

                    if (o.itens) {
                        o.itens.forEach(it => {
                            if (it.prod > 0) {
                                if (it.statusProd === 'Pago') { prodQtdPaga++; prodValorPago += it.prod; } 
                                else { prodQtdPendente++; prodValorPendente += it.prod; }
                            }
                            if (it.inst > 0) {
                                if (it.statusInst === 'Pago') { instQtdPaga++; instValorPago += it.inst; } 
                                else { instQtdPendente++; instValorPendente += it.inst; }
                            }
                        });
                    }
                    
                    html += `
                        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 hover:border-emerald-300 dark:hover:border-emerald-500 transition-colors cursor-pointer group flex flex-col" onclick="abrirObra('${o.id}')">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <div class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-1">OS #${o.numeroOS}</div>
                                    <h3 class="text-lg font-bold text-slate-800 dark:text-white group-hover:text-emerald-700 dark:group-hover:text-emerald-300 transition-colors">${o.nome}</h3>
                                </div>
                                <div class="text-right">
                                    <div class="text-sm text-slate-500 dark:text-slate-400 mb-1">Total Previsto</div>
                                    <div class="font-bold text-slate-800 dark:text-white">${formatMoney(totalObra)}</div>
                                </div>
                            </div>
                            
                            <!-- Financial Mini Dashboard -->
                            <div class="mt-auto pt-3 border-t border-slate-100 dark:border-slate-700">
                                <div class="grid grid-cols-[auto_1fr_1fr] gap-2 text-xs text-center mb-2">
                                    <div class="text-left text-slate-500 dark:text-slate-400 font-medium">Etapa</div>
                                    <div class="text-emerald-600 dark:text-emerald-400 font-medium">Pago ✅</div>
                                    <div class="text-amber-600 dark:text-amber-400 font-medium">A Pagar ⏳</div>
                                </div>
                                
                                <div class="grid grid-cols-[auto_1fr_1fr] gap-2 text-xs text-center mb-1.5 items-center">
                                    <div class="text-left font-medium text-slate-700 dark:text-slate-300 pr-2">Produção</div>
                                    <div class="bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800/50 text-emerald-700 dark:text-emerald-300 py-1.5 rounded flex flex-col">
                                        <span class="text-[10px] mb-0.5">${prodQtdPaga} un</span>
                                        <span class="font-bold">${formatMoney(prodValorPago)}</span>
                                    </div>
                                    <div class="bg-amber-50 dark:bg-amber-900/30 border border-amber-100 dark:border-amber-800/50 text-amber-700 dark:text-amber-300 py-1.5 rounded flex flex-col">
                                        <span class="text-[10px] mb-0.5">${prodQtdPendente} un</span>
                                        <span class="font-bold">${formatMoney(prodValorPendente)}</span>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-[auto_1fr_1fr] gap-2 text-xs text-center mb-3 items-center">
                                    <div class="text-left font-medium text-slate-700 dark:text-slate-300 pr-2">Instalação</div>

                { id: '4', desc: 'MAXIM-AR E FIXO 02 MOD.', m2: 1.50, prod: 0, inst: 0, statusProd: 'Pendente', statusInst: 'Pendente', dataProd: null, dataInst: null, obsProd: '', obsInst: '' },
                { id: '5', desc: 'PORTA DE CORRER 03 FOLHAS', m2: 4.80, prod: 0, inst: 0, statusProd: 'Pendente', statusInst: 'Pendente', dataProd: null, dataInst: null, obsProd: '', obsInst: '' },
                { id: '6', desc: 'PORTA DE CORRER 02 FOLHAS', m2: 3.60, prod: 0, inst: 0, statusProd: 'Pendente', statusInst: 'Pendente', dataProd: null, dataInst: null, obsProd: '', obsInst: '' },
                { id: '7', desc: 'JANELA DE CORRER 04 FOLHAS', m2: 2.40, prod: 0, inst: 0, statusProd: 'Pendente', statusInst: 'Pendente', dataProd: null, dataInst: null, obsProd: '', obsInst: '' }
            ];
            renderObra();
            showAlert('Sucesso', 'PDF importado! 9 itens base e metragens extraídos. Agora cole os valores na etapa 2.', true);
        }

        function processarWhatsApp() {
            const texto = document.getElementById('whatsapp-text').value;
            if (!texto.trim()) return showAlert('Atenção', 'Cole a mensagem com os valores de negociação primeiro.');
            const t = db.parceiros.find(p => p.id === currentParceiroId);
            const o = t.obras.find(o => o.id === currentObraId);
            if (o.itens.length === 0) return showAlert('Erro', 'Importe o PDF na etapa 1 antes de aplicar os valores.');

            o.itens.forEach(it => {
                if(it.id === '1') { it.prod = 350; it.inst = 350; }
                if(it.id.startsWith('2')) { it.prod = 120; it.inst = 200; }
                if(it.id.startsWith('3')) { it.prod = 350; it.inst = 300; }
                if(it.id === '4') { it.prod = 350; it.inst = 350; }
                if(it.id === '5') { it.prod = 350; it.inst = 350; }
                if(it.id === '6') { it.prod = 250; it.inst = 260; }
                if(it.id === '7') { it.prod = 180; it.inst = 200; }
            });
            document.getElementById('whatsapp-text').value = '';
            renderObra();
            showAlert('Valores Aplicados', 'Os valores do WhatsApp foram cruzados com sucesso! Custos de R$/m² calculados.', true);
        }

        function liberarPagamento(idItem, etapa, dataVal) {
            const t = db.parceiros.find(p => p.id === currentParceiroId);
            const o = t.obras.find(o => o.id === currentObraId);
            const it = o.itens.find(i => i.id === idItem);
            
            if (etapa === 'prod') it.dataProd = dataVal;
            if (etapa === 'inst') it.dataInst = dataVal;
            const btn = document.getElementById(`btn-${etapa}-${idItem}`);
            if (dataVal) btn.removeAttribute('disabled');
            else btn.setAttribute('disabled', 'true');
        }

        function processarPagamento(idItem, etapa, valor) {
            const t = db.parceiros.find(p => p.id === currentParceiroId);
            const o = t.obras.find(o => o.id === currentObraId);
            const it = o.itens.find(i => i.id === idItem);
            const textoEtapa = etapa === 'prod' ? 'Produção' : 'Instalação';
            
            const html = `
                <div class="text-center pb-2">
                    <p class="text-slate-600 dark:text-slate-300 mb-4">Confirmar pagamento da <strong>${textoEtapa}</strong> para a peça <strong>ID ${idItem}</strong>?</p>
                    <div class="bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-800/50 rounded-lg p-4">
                        <span class="block text-sm text-emerald-600 dark:text-emerald-400 mb-1">Valor a ser liberado</span>
                        <span class="text-3xl font-bold text-emerald-700 dark:text-emerald-300">${formatMoney(valor)}</span>
                    </div>
                </div>
            `;
            showModal({ title: 'Confirmação Financeira', html: html, confirmText: 'Registrar Pagamento', onConfirm: () => {
                if (etapa === 'prod') it.statusProd = 'Pago';
                if (etapa === 'inst') it.statusInst = 'Pago';
                closeModal(); renderObra();
            }});
        }

        function abrirObs(idItem, etapa) {
            const t = db.parceiros.find(p => p.id === currentParceiroId);
            const o = t.obras.find(o => o.id === currentObraId);
            const it = o.itens.find(i => i.id === idItem);
            const txtAtual = etapa === 'prod' ? it.obsProd : it.obsInst;
            const titulo = etapa === 'prod' ? 'Produção' : 'Instalação';

            const html = `
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Anotações - ${titulo} (Peça ${idItem})</label>
                    <textarea id="modal-obs-text" rows="4" class="w-full p-3 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-emerald-500">${txtAtual}</textarea>
                </div>
            `;
            showModal({ title: 'Observações do Item', html: html, confirmText: 'Salvar', onConfirm: () => {
                const novoTxt = document.getElementById('modal-obs-text').value;
                if (etapa === 'prod') it.obsProd = novoTxt;
                if (etapa === 'inst') it.obsInst = novoTxt;
                closeModal();
            }});
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderDashboard();
        });
    </script>
</body>
</html>
