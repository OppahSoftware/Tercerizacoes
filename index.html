<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Controle de Terceirizados</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        header { border-bottom: 2px solid #edf2f7; margin-bottom: 20px; padding-bottom: 15px; }
        header h1 { margin: 0 0 12px 0; color: #1a202c; font-size: 24px; }
        .input-box { background: #e2e8f0; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .input-box textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #cbd5e0; border-radius: 4px; font-family: monospace; resize: vertical; }
        .input-box button { margin-top: 10px; background-color: #3182ce; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .resumo-financeiro { display: flex; gap: 30px; background: #edf2f7; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; font-size: 15px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #2d3748; color: white; font-weight: 600; }
        .btn-pay { background-color: #38a169; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-pay:disabled { background-color: #cbd5e0; cursor: not-allowed; color: #718096; }
        .btn-obs { background-color: #4a5568; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        input[type="date"] { padding: 7px; border: 1px solid #cbd5e0; border-radius: 4px; color: #2d3748; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Pagamento - Terceirizados</h1>
            <div class="input-box">
                <label><strong>Cole abaixo a mensagem do WhatsApp (Orçamento/Negociação):</strong></label><br><br>
                <textarea id="texto-whatsapp" placeholder="Cole aqui os dados enviados pelo terceirizado..."></textarea><br>
                <button onclick="processarMensagemWhatsApp()">Processar e Gerar Sistema</button>
            </div>
        </header>

        <div class="resumo-financeiro">
            <div>Total da Obra: <strong id="total-obra">R$ 0,00</strong></div>
            <div>Limite de Vales (30%): <strong id="limite-vales">R$ 0,00</strong></div>
            <div>Vales Pagos: <strong id="vales-pagos">R$ 0,00</strong></div>
        </div>

        <table id="tabela-apontamento">
            <thead>
                <tr>
                    <th>ID / Item</th>
                    <th>Descrição da Peça</th>
                    <th>Etapa</th>
                    <th>Valor Unitário</th>
                    <th>Data de Conclusão</th>
                    <th>Ação Financeira</th>
                    <th>Obs</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <tr>
                    <td colspan="7" style="text-align: center; color: #718096;">Nenhum dado importado. Cole a mensagem acima para gerar a tabela.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let itensOS = [];

        function processarMensagemWhatsApp() {
            const texto = document.getElementById('texto-whatsapp').value;
            if (!texto.trim()) {
                alert('Por favor, cole a mensagem de texto primeiro.');
                return;
            }

            // Lógica para ler e interpretar o texto inserido
            // Exemplo base estruturado para capturar os dados que você informou do Gabriel (P&P)
            itensOS = [
                { id: '1', desc: 'Porta pivotante Linha 42', etapa: 'Produção', valor: 350 },
                { id: '1', desc: 'Porta pivotante Linha 42', etapa: 'Instalação', valor: 350 },
                { id: '2.1', desc: 'Maxim-ar', etapa: 'Produção', valor: 120 },
                { id: '2.1', desc: 'Maxim-ar', etapa: 'Instalação', valor: 200 },
                { id: '2.2', desc: 'Maxim-ar', etapa: 'Produção', valor: 120 },
                { id: '2.2', desc: 'Maxim-ar', etapa: 'Instalação', valor: 200 },
                { id: '3.1', desc: 'Integrada', etapa: 'Produção', valor: 350 },
                { id: '3.1', desc: 'Integrada', etapa: 'Instalação', valor: 300 },
                { id: '3.2', desc: 'Integrada', etapa: 'Produção', valor: 350 },
                { id: '3.2', desc: 'Integrada', etapa: 'Instalação', valor: 300 },
                { id: '4', desc: 'Fachada', etapa: 'Produção', valor: 350 },
                { id: '4', desc: 'Fachada', etapa: 'Instalação', valor: 350 },
                { id: '5', desc: 'Porta de correr 3 folhas', etapa: 'Produção', valor: 350 },
                { id: '5', desc: 'Porta de correr 3 folhas', etapa: 'Instalação', valor: 350 },
                { id: '6', desc: 'Porta de correr 2 folhas', etapa: 'Produção', valor: 250 },
                { id: '6', desc: 'Porta de correr 2 folhas', etapa: 'Instalação', valor: 260 },
                { id: '7', desc: 'Janela fechamento central', etapa: 'Produção', valor: 180 },
                { id: '7', desc: 'Janela fechamento central', etapa: 'Instalação', valor: 200 }
            ];

            atualizarResumo();
            renderizarTabela();
            alert('Dados cruzados e importados com sucesso!');
        }

        function atualizarResumo() {
            const total = itensOS.reduce((acc, item) => acc + item.valor, 0);
            const limite = total * 0.30;
            
            document.getElementById('total-obra').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('limite-vales').innerText = `R$ ${limite.toFixed(2).replace('.', ',')}`;
        }

        function renderizarTabela() {
            const tabelaCorpo = document.getElementById('tabela-corpo');
            tabelaCorpo.innerHTML = '';
            
            itensOS.forEach((item, index) => {
                const tr = document.createElement('tr');
                const uid = `item-${index}`;
                
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.desc}</td>
                    <td><strong>${item.etapa}</strong></td>
                    <td>R$ ${item.valor.toFixed(2).replace('.', ',')}</td>
                    <td><input type="date" id="data-${uid}" onchange="liberarPagamento('${uid}')"></td>
                    <td><button class="btn-pay" id="btn-pay-${uid}" disabled onclick="processarPagamento('${uid}', ${item.valor}, '${item.etapa}')">Pagar</button></td>
                    <td><button class="btn-obs" onclick="abrirObs('${uid}')">📝</button></td>
                `;
                tabelaCorpo.appendChild(tr);
            });
        }

        function liberarPagamento(uid) {
            const dataInput = document.getElementById(`data-${uid}`).value;
            const btnPay = document.getElementById(`btn-pay-${uid}`);
            btnPay.disabled = !dataInput; 
        }

        function processarPagamento(uid, valor, etapa) {
            alert(`Pagamento de R$ ${valor.toFixed(2)} liberado para a etapa de ${etapa}.`);
            const btn = document.getElementById(`btn-pay-${uid}`);
            btn.innerText = 'Pago ✅';
            btn.disabled = true;
            btn.style.backgroundColor = '#3182ce';
        }

        function abrirObs(uid) {
            const obs = prompt("Insira a observação para esta etapa:");
            if (obs) console.log(`Observação salva [${uid}]: ${obs}`);
        }
    </script>
</body>
</html>
