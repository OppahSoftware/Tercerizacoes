<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Terceirizações</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Pagamento - Terceirizados</h1>
            
            <!-- Nova seção de importação -->
            <div style="margin-top: 15px; padding: 15px; background: #e2e8f0; border-radius: 6px;">
                <label style="font-weight: bold; margin-right: 10px;">Importar Ordem de Serviço:</label>
                <input type="file" id="pdf-upload" accept="application/pdf">
                <button class="btn-pay" onclick="importarPDF()">Processar PDF</button>
            </div>
        </header>

        <div class="resumo-financeiro">
            <div>Total da Obra: <strong id="total-obra">R$ 0,00</strong></div>
            <div>Limite de Vales (30%): <strong id="limite-vales">R$ 0,00</strong></div>
            <div>Vales Pagos: <strong id="vales-pagos">R$ 0,00</strong></div>
        </div>

        <table id="tabela-apontamento">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição da Peça</th>
                    <th>Etapa</th>
                    <th>Valor</th>
                    <th>Data de Conclusão</th>
                    <th>Ação Financeira</th>
                    <th>Obs</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Linhas geradas após o upload -->
            </tbody>
        </table>
    </div>

    <!-- Importando a biblioteca PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
