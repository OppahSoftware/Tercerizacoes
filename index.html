<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Controle de Terceirizados</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1150px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        header { border-bottom: 2px solid #edf2f7; margin-bottom: 20px; padding-bottom: 15px; }
        header h1 { margin: 0 0 12px 0; color: #1a202c; font-size: 24px; }
        .upload-box { background: #e2e8f0; padding: 12px 15px; border-radius: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .resumo-financeiro { display: flex; gap: 30px; background: #edf2f7; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; font-size: 15px; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #2d3748; color: white; font-weight: 600; }
        .btn-primary { background-color: #3182ce; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-pay { background-color: #38a169; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-pay:disabled { background-color: #cbd5e0; cursor: not-allowed; color: #718096; }
        .btn-obs { background-color: #4a5568; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        input[type="date"] { padding: 7px; border: 1px solid #cbd5e0; border-radius: 4px; color: #2d3748; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Pagamento - Terceirizados</h1>
            <div class="upload-box">
                <label><strong>Importar Ordem de Serviço (PDF):</strong></label>
                <input type="file" id="pdf-upload" accept="application/pdf">
                <button class="btn-primary" onclick="importarPDF()">Processar PDF</button>
            </div>
        </header>

        <div class="resumo-financeiro">
            <div>Total da Obra: <strong id="total-obra">R$ 0,00</strong></div>
            <div>Limite de Vales (30%): <strong id="limite-vales">R$ 0,00</strong></div>
            <div>Vales Pagos: <strong id="vales-pagos">R$ 0,00</strong></div>
        </div>

        <table id="tabela-apontamento">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição da Peça</th>
                    <th>Etapa</th>
                    <th>Valor</th>
                    <th>Data de Conclusão</th>
                    <th>Ação Financeira</th>
                    <th>Obs</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Os dados aparecem aqui após processar o PDF -->
            </tbody>
        </table>
    </div>

    <!-- Biblioteca para ler o PDF direto no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let itensOS = [];
        const tabelaCorpo = document.getElementById('tabela-corpo');

        async function importarPDF() {
            const fileInput = document.getElementById('pdf-upload');
            if (fileInput.files.length === 0) {
                alert('Selecione o arquivo PDF da Ordem de Serviço.');
                return;
            }

            const file = fileInput.files[0];
            const fileReader = new FileReader();

            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let textoCompleto = '';

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    textoCompleto += textContent.items.map(item => item.str).join(' ') + ' ';
                }

                // Validação básica simulando a OS 461 da Obra Jean Camargo
                if (textoCompleto.includes("461") || textoCompleto.includes("JEAN CAMARGO")) {
                    alert("Ordem de Serviço lida com sucesso! Carregando os itens...");
                    carregarDadosOS461();
                } else {
                    alert("PDF lido, mas os dados não correspondem ao formato esperado.");
                }
            };

            fileReader.readAsArrayBuffer(file);
        }

        function carregarDadosOS461() {
            // Dados desmembrados conforme combinado
            itensOS = [
                { id: '1', desc: 'PORTA DE GIRO 01 FOLHA | LINHA 42', etapa: 'Produção', valor: 350 },
                { id: '1', desc: 'PORTA DE GIRO 01 FOLHA | LINHA 42', etapa: 'Instalação', valor: 350 },
                { id: '2.1', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', etapa: 'Produção', valor: 120 },
                { id: '2.1', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', etapa: 'Instalação', valor: 200 },
                { id: '2.2', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', etapa: 'Produção', valor: 120 },
                { id: '2.2', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', etapa: 'Instalação', valor: 200 }
            ];
            
            atualizarResumo();
            renderizarTabela();
        }

        function atualizarResumo() {
            const total = itensOS.reduce((acc, item) => acc + item.valor, 0);
            const limite = total * 0.30;
            
            document.getElementById('total-obra').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            document.getElementById('limite-vales').innerText = `R$ ${limite.toFixed(2).replace('.', ',')}`;
        }

        function renderizarTabela() {
            tabelaCorpo.innerHTML = '';
            itensOS.forEach((item) => {
                const tr = document.createElement('tr');
                const uid = `${item.id}-${item.etapa.toLowerCase()}`.replace('.', '-');
                
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.desc}</td>
                    <td><strong>${item.etapa}</strong></td>
                    <td>R$ ${item.valor.toFixed(2).replace('.', ',')}</td>
                    <td><input type="date" id="data-${uid}" onchange="liberarPagamento('${uid}')"></td>
                    <td><button class="btn-pay" id="btn-pay-${uid}" disabled onclick="processarPagamento('${uid}', ${item.valor}, '${item.etapa}')">Pagar</button></td>
                    <td><button class="btn-obs" onclick="abrirObs('${uid}')">📝</button></td>
                `;
                tabelaCorpo.appendChild(tr);
            });
        }

        function liberarPagamento(uid) {
            const dataInput = document.getElementById(`data-${uid}`).value;
            const btnPay = document.getElementById(`btn-pay-${uid}`);
            btnPay.disabled = !dataInput; 
        }

        function processarPagamento(uid, valor, etapa) {
            alert(`Pagamento de R$ ${valor.toFixed(2)} liberado para a etapa de ${etapa}.`);
            const btn = document.getElementById(`btn-pay-${uid}`);
            btn.innerText = 'Pago ✅';
            btn.disabled = true;
            btn.style.backgroundColor = '#3182ce';
        }

        function abrirObs(uid) {
            const obs = prompt("Insira a observação para esta etapa:");
            if (obs) console.log(`Observação salva [${uid}]: ${obs}`);
        }
    </script>
</body>
</html>
