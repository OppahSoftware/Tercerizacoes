<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Terceirizações</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Controle de Pagamento - Terceirizados</h1>
            <p><strong>OS 461</strong> | Obra: JEAN CAMARGO | Prestador: P&P Esquadrias (Gabriel)</p>
        </header>

        <div class="resumo-financeiro">
            <div>Total da Obra: <strong>R$ 4.930,00</strong></div>
            <div>Limite de Vales (30%): <strong>R$ 1.479,00</strong></div>
            <div>Vales Pagos: <strong id="vales-pagos">R$ 0,00</strong></div>
        </div>

        <table id="tabela-apontamento">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição da Peça</th>
                    <th>Etapa</th>
                    <th>Valor</th>
                    <th>Data de Conclusão</th>
                    <th>Ação Financeira</th>
                    <th>Obs</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- As linhas são geradas dinamicamente pelo JavaScript -->
            </tbody>
        </table>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
