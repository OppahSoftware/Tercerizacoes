<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Terceirizações</title>
    
    <script>
        window.tailwind = {
            config: {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'sans-serif'] },
                        colors: { oppah: { 500: '#3182ce', 600: '#2b6cb0' } }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms ease-out, transform 200ms ease-out; }
        
        /* Custom Scrollbar for tables */
        .table-container { max-height: 500px; overflow-y: auto; }
        .table-container thead th { position: sticky; top: 0; z-index: 10; }
        
        /* Print Styles */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .container { box-shadow: none !important; max-width: 100% !important; padding: 0 !important; }
            /* Turn date inputs into plain text blocks */
            input[type="date"] { border: none !important; background: transparent !important; color: black !important; padding: 0 !important; font-family: inherit !important; }
            /* Ensure table borders show in print */
            table, th, td { border-collapse: collapse !important; border: 1px solid #cbd5e0 !important; }
            th { background-color: #f7fafc !important; color: black !important; }
            .badge-print { border: 1px solid #38a169; padding: 2px 5px; border-radius: 4px; color: #38a169; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-200 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Top Navbar -->
        <header class="flex justify-between items-center mb-8 bg-white dark:bg-slate-800 p-4 md:px-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-oppah-500 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-inner">O</div>
                <h1 class="text-xl md:text-2xl font-bold">Portal Oppah <span class="font-normal text-slate-500 dark:text-slate-400">| Terceirizações</span></h1>
            </div>
            <div class="flex gap-4">
                <button onclick="toggleDarkMode()" id="theme-toggle" class="no-print p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition" title="Alternar Tema">
                    <!-- Icon updated via JS -->
                </button>
            </div>
        </header>

        <!-- Main Dynamic Content Area -->
        <main id="app-content" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 min-h-[60vh]">
            <!-- Rendered by JS -->
        </main>
    </div>

    <!-- Reusable Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-700 p-6 transform transition-all">
            <!-- Modal body goes here -->
        </div>
    </div>

    <!-- Custom Alert Overlay -->
    <div id="alert-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-sm border border-slate-200 dark:border-slate-700 p-6 text-center transform transition-all">
            <h3 id="alert-title" class="text-lg font-bold mb-2">Mensagem</h3>
            <p id="alert-message" class="text-slate-600 dark:text-slate-300 mb-6"></p>
            <button onclick="closeAlert()" class="bg-oppah-500 hover:bg-oppah-600 text-white font-medium py-2 px-6 rounded-lg transition">OK</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // --- Database ---
        let db = {
            terceirizados: [],
            obras: [],
            itens: []
        };
        let currentView = 'dashboard'; 
        let currentTerceirizadoId = null;
        let currentObraId = null;

        // --- Utilities ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);

        // --- Theme Logic ---
        function initTheme() {
            let savedTheme = null;
            try { savedTheme = localStorage.getItem('theme'); } catch(e) { console.log('Storage blocked'); }
            
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const html = document.documentElement;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            
            try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch(e) {}
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById('theme-toggle');
            if(btn) {
                btn.innerHTML = isDark 
                    ? `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`
                    : `<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`;
            }
        }

        // Print handlers to temporarily remove dark mode for paper saving
        window.addEventListener('beforeprint', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('temp-light'); // flag
            }
        });
        window.addEventListener('afterprint', () => {
            if (document.documentElement.classList.contains('temp-light')) {
                document.documentElement.classList.remove('temp-light');
                document.documentElement.classList.add('dark');
            }
        });

        // --- UI Modal Controls ---
        function openModal(contentHtml) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = contentHtml;
            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function customAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-overlay').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alert-overlay').classList.add('hidden');
        }

        function customPrompt(title, defaultValue, callback) {
            const html = `
                <h3 class="text-lg font-bold mb-4">${title}</h3>
                <input type="text" id="prompt-input" value="${defaultValue || ''}" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700 focus:outline-none focus:border-oppah-500 mb-4">
                <div class="flex justify-end gap-2">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded transition">Cancelar</button>
                    <button onclick="(() => { const val = document.getElementById('prompt-input').value; closeModal(); ${callback.name}(val); })()" class="px-4 py-2 bg-oppah-500 hover:bg-oppah-600 text-white rounded transition">Salvar</button>
                </div>
            `;
            openModal(html);
        }

        // --- Dashboard / Terceirizados ---
        function renderDashboard() {
            currentTerceirizadoId = null;
            currentObraId = null;
            const container = document.getElementById('app-content');
            
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Terceirizados (Empreiteiros)</h2>
                    <button onclick="modalNovoTerceirizado()" class="no-print bg-oppah-500 hover:bg-oppah-600 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                        + Novo Terceirizado
                    </button>
                </div>
            `;

            if (db.terceirizados.length === 0) {
                html += `<div class="text-center py-12 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-dashed border-slate-300 dark:border-slate-600">
                    <p class="text-slate-500 dark:text-slate-400 text-lg">Nenhum prestador de serviço cadastrado.</p>
                    <button onclick="modalNovoTerceirizado()" class="mt-4 text-oppah-500 font-medium hover:underline">Cadastrar o primeiro agora</button>
                </div>`;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
                db.terceirizados.forEach(t => {
                    const qtdObras = db.obras.filter(o => o.terceirizadoId === t.id).length;
                    html += `
                        <div class="p-5 border border-slate-200 dark:border-slate-700 rounded-xl hover:shadow-md transition bg-slate-50 dark:bg-slate-800 cursor-pointer" onclick="renderObras('${t.id}')">
                            <h3 class="font-bold text-lg mb-1">${t.empresa}</h3>
                            <div class="text-sm text-slate-500 dark:text-slate-400 space-y-1 mb-4">
                                <p>👤 ${t.responsavel}</p>
                                <p>📱 ${t.telefone || 'Não informado'}</p>
                                <p>📄 ${t.documento || 'Sem doc'}</p>
                            </div>
                            <div class="flex justify-between items-center border-t border-slate-200 dark:border-slate-700 pt-3">
                                <span class="text-sm font-medium text-slate-600 dark:text-slate-300">${qtdObras} Obras ativas</span>
                                <span class="text-oppah-500 text-sm font-bold">Acessar &rarr;</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function modalNovoTerceirizado() {
            const html = `
                <h3 class="text-xl font-bold mb-4 border-b pb-2 dark:border-slate-700">Cadastrar Terceirizado</h3>
                <div class="space-y-3">
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Nome da Empresa *</label><input type="text" id="t-empresa" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Responsável *</label><input type="text" id="t-resp" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">CPF / CNPJ</label><input type="text" id="t-doc" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Telefone / WhatsApp</label><input type="text" id="t-tel" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Chave PIX</label><input type="text" id="t-pix" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded font-medium transition">Cancelar</button>
                    <button onclick="salvarTerceirizado()" class="px-4 py-2 bg-oppah-500 hover:bg-oppah-600 text-white rounded font-medium transition">Salvar Cadastro</button>
                </div>
            `;
            openModal(html);
        }

        function salvarTerceirizado() {
            const empresa = document.getElementById('t-empresa').value;
            const resp = document.getElementById('t-resp').value;
            if (!empresa || !resp) { customAlert('Erro', 'Empresa e Responsável são obrigatórios.'); return; }
            
            db.terceirizados.push({
                id: generateId(),
                empresa,
                responsavel: resp,
                documento: document.getElementById('t-doc').value,
                telefone: document.getElementById('t-tel').value,
                pix: document.getElementById('t-pix').value
            });
            closeModal();
            customAlert('Sucesso', 'Terceirizado cadastrado com sucesso!');
            renderDashboard();
        }

        // --- Obras ---
        function renderObras(terceirizadoId) {
            currentTerceirizadoId = terceirizadoId;
            const terceirizado = db.terceirizados.find(t => t.id === terceirizadoId);
            const obras = db.obras.filter(o => o.terceirizadoId === terceirizadoId);
            const container = document.getElementById('app-content');

            let html = `
                <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <button onclick="renderDashboard()" class="no-print text-sm text-slate-500 dark:text-slate-400 hover:text-oppah-500 mb-2 flex items-center gap-1">&larr; Voltar ao Início</button>
                        <h2 class="text-2xl font-bold flex items-center gap-2">👤 ${terceirizado.empresa} <span class="text-sm font-normal text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded">Obras</span></h2>
                    </div>
                    <button onclick="modalNovaObra()" class="no-print bg-oppah-500 hover:bg-oppah-600 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm">
                        + Nova Obra
                    </button>
                </div>
            `;

            if (obras.length === 0) {
                html += `<div class="text-center py-12 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-dashed border-slate-300 dark:border-slate-600">
                    <p class="text-slate-500 dark:text-slate-400 text-lg">Nenhuma obra cadastrada para este parceiro.</p>
                </div>`;
            } else {
                html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">`;
                obras.forEach(o => {
                    const itensObra = db.itens.filter(i => i.obraId === o.id);
                    
                    // Calculation Grid logic
                    let prodPagas = 0, prodPendentes = 0, instPagas = 0, instPendentes = 0;
                    let valProdPago = 0, valProdPendente = 0, valInstPago = 0, valInstPendente = 0;

                    itensObra.forEach(item => {
                        if (item.etapa.toLowerCase() === 'produção') {
                            if (item.pago) { prodPagas++; valProdPago += item.valor; } 
                            else { prodPendentes++; valProdPendente += item.valor; }
                        } else {
                            if (item.pago) { instPagas++; valInstPago += item.valor; } 
                            else { instPendentes++; valInstPendente += item.valor; }
                        }
                    });

                    const totalPeças = itensObra.length;
                    
                    html += `
                        <div class="border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden bg-white dark:bg-slate-800 shadow-sm flex flex-col">
                            <div class="p-4 bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                                <h3 class="font-bold text-lg">${o.nome}</h3>
                                <span class="bg-slate-200 dark:bg-slate-600 text-xs px-2 py-1 rounded font-bold">${totalPeças} Peças Cadastradas</span>
                            </div>
                            
                            <!-- Financial Grid -->
                            <div class="p-4 grid grid-cols-2 gap-4 text-sm flex-grow">
                                <!-- Production Col -->
                                <div class="bg-blue-50 dark:bg-blue-900/20 p-3 rounded-lg border border-blue-100 dark:border-blue-800">
                                    <p class="font-bold text-blue-800 dark:text-blue-300 mb-2 border-b border-blue-200 dark:border-blue-700 pb-1">⚙️ Produção</p>
                                    <div class="space-y-2">
                                        <div class="flex justify-between items-center text-emerald-600 dark:text-emerald-400">
                                            <span>Pago (${prodPagas})</span>
                                            <span class="font-bold">${formatMoney(valProdPago)}</span>
                                        </div>
                                        <div class="flex justify-between items-center text-amber-600 dark:text-amber-500">
                                            <span>Pendente (${prodPendentes})</span>
                                            <span class="font-bold">${formatMoney(valProdPendente)}</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Installation Col -->
                                <div class="bg-purple-50 dark:bg-purple-900/20 p-3 rounded-lg border border-purple-100 dark:border-purple-800">
                                    <p class="font-bold text-purple-800 dark:text-purple-300 mb-2 border-b border-purple-200 dark:border-purple-700 pb-1">🛠️ Instalação</p>
                                    <div class="space-y-2">
                                        <div class="flex justify-between items-center text-emerald-600 dark:text-emerald-400">
                                            <span>Pago (${instPagas})</span>
                                            <span class="font-bold">${formatMoney(valInstPago)}</span>
                                        </div>
                                        <div class="flex justify-between items-center text-amber-600 dark:text-amber-500">
                                            <span>Pendente (${instPendentes})</span>
                                            <span class="font-bold">${formatMoney(valInstPendente)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="p-3 border-t border-slate-200 dark:border-slate-700">
                                <button onclick="renderObraPanel('${o.id}')" class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-white font-medium py-2 rounded transition">
                                    Acessar Painel da Obra
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function modalNovaObra() {
            const html = `
                <h3 class="text-xl font-bold mb-4 border-b pb-2 dark:border-slate-700">Nova Obra</h3>
                <div>
                    <label class="text-sm font-bold text-slate-600 dark:text-slate-300">Identificação / Nome da Obra *</label>
                    <input type="text" id="o-nome" placeholder="Ex: OS 461 - Ed. Vivaldi" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded font-medium transition">Cancelar</button>
                    <button onclick="salvarObra()" class="px-4 py-2 bg-oppah-500 hover:bg-oppah-600 text-white rounded font-medium transition">Criar Obra</button>
                </div>
            `;
            openModal(html);
        }

        function salvarObra() {
            const nome = document.getElementById('o-nome').value;
            if (!nome) { customAlert('Erro', 'O nome da obra é obrigatório.'); return; }
            
            db.obras.push({ id: generateId(), terceirizadoId: currentTerceirizadoId, nome });
            closeModal();
            renderObras(currentTerceirizadoId);
        }

        // --- Painel da Obra (PDF, WhatsApp, Tabela) ---
        function renderObraPanel(obraId) {
            currentObraId = obraId;
            const obra = db.obras.find(o => o.id === obraId);
            const terceirizado = db.terceirizados.find(t => t.id === currentTerceirizadoId);
            const container = document.getElementById('app-content');

            let html = `
                <!-- Header Control -->
                <div class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b pb-4 dark:border-slate-700">
                    <div>
                        <button onclick="renderObras('${terceirizado.id}')" class="no-print text-sm text-slate-500 dark:text-slate-400 hover:text-oppah-500 mb-2 flex items-center gap-1">&larr; Voltar às Obras</button>
                        <h2 class="text-2xl font-bold flex flex-col md:flex-row md:items-center gap-2">
                            ${obra.nome} 
                            <span class="text-sm font-normal text-slate-500 bg-slate-100 dark:bg-slate-700 dark:text-slate-300 px-2 py-1 rounded">Resp: ${terceirizado.empresa}</span>
                        </h2>
                    </div>
                    <button onclick="window.print()" class="no-print bg-slate-800 dark:bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium transition shadow-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Imprimir Relatório
                    </button>
                </div>

                <!-- Tool Actions (Hidden on Print) -->
                <div class="no-print grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600">
                        <label class="block font-bold mb-2 text-sm">1. Extrair PDF (M² e Descrições)</label>
                        <div class="flex gap-2">
                            <input type="file" id="pdf-upload" accept="application/pdf" class="flex-1 text-sm bg-white dark:bg-slate-800 border rounded p-1 dark:border-slate-600">
                            <button onclick="importarPDF()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1 rounded text-sm font-medium transition">Ler</button>
                        </div>
                    </div>
                    
                    <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600 flex flex-col justify-center">
                        <label class="block font-bold mb-2 text-sm">2. Valores do WhatsApp</label>
                        <button onclick="abrirWhatsAppModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-medium transition flex justify-center items-center gap-2">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                            Cruzar Valores
                        </button>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl border border-slate-200 dark:border-slate-600 flex flex-col justify-center">
                        <label class="block font-bold mb-2 text-sm">3. Inclusão Direta</label>
                        <button onclick="modalItemManual()" class="w-full bg-oppah-500 hover:bg-oppah-600 text-white px-4 py-2 rounded font-medium transition flex justify-center items-center gap-2">
                            + Adicionar Item Manual
                        </button>
                    </div>
                </div>

                <!-- Financial Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6" id="resumo-financeiro">
                    <!-- Updated by JS -->
                </div>

                <!-- Table -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm overflow-hidden">
                    <div class="table-container w-full overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm">
                                <tr>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold whitespace-nowrap">ID / Peça</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold">Descrição</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold">M²</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold">Etapa</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold whitespace-nowrap">R$ Un.</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold whitespace-nowrap">R$ / M²</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold">Data Conclusão</th>
                                    <th class="p-3 border-b border-slate-200 dark:border-slate-600 font-bold no-print text-center">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-corpo" class="text-sm divide-y divide-slate-100 dark:divide-slate-700/50">
                                <!-- Rendered by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            
            atualizarResumoFinancas();
            renderTabelaObra();
        }

        async function importarPDF() {
            const fileInput = document.getElementById('pdf-upload');
            if (fileInput.files.length === 0) {
                customAlert('Aviso', 'Selecione um arquivo PDF primeiro.');
                return;
            }

            const file = fileInput.files[0];
            const fileReader = new FileReader();

            fileReader.onload = async function() {
                // Simulating extraction logic for 9 items specifically extracting the Square Meters
                const extractedItens = [
                    { pid: '1', desc: 'PORTA DE GIRO 01 FOLHA | LINHA 42', m2: 2.10 },
                    { pid: '2.1', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', m2: 0.85 },
                    { pid: '2.2', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', m2: 0.85 },
                    { pid: '3.1', desc: 'JANELA DE CORRER INTEGRADA 02 FOLHAS', m2: 3.20 },
                    { pid: '3.2', desc: 'JANELA DE CORRER INTEGRADA 02 FOLHAS', m2: 3.20 },
                    { pid: '4', desc: 'MAXIM-AR E FIXO 02 MOD. HORIZONTAIS', m2: 1.50 },
                    { pid: '5', desc: 'PORTA DE CORRER 03 FOLHAS MÓVEIS', m2: 6.00 },
                    { pid: '6', desc: 'PORTA DE CORRER 02 FOLHAS MÓVEIS', m2: 4.50 },
                    { pid: '7', desc: 'JANELA DE CORRER 04 FOLHAS', m2: 2.80 }
                ];

                // Create pairs (Production and Installation) with 0 value initially
                extractedItens.forEach(item => {
                    db.itens.push({ id: generateId(), obraId: currentObraId, pid: item.pid, desc: item.desc, m2: item.m2, etapa: 'Produção', valor: 0, pago: false, data: '', obs: '' });
                    db.itens.push({ id: generateId(), obraId: currentObraId, pid: item.pid, desc: item.desc, m2: item.m2, etapa: 'Instalação', valor: 0, pago: false, data: '', obs: '' });
                });

                customAlert('Sucesso', `${extractedItens.length} itens extraídos do PDF (Com M²). Agora cole o texto do WhatsApp para preencher os valores em Reais.`);
                atualizarResumoFinancas();
                renderTabelaObra();
            };
            fileReader.readAsArrayBuffer(file);
        }

        function abrirWhatsAppModal() {
            const html = `
                <h3 class="text-xl font-bold mb-4 border-b pb-2 dark:border-slate-700">Cruzar Valores do WhatsApp</h3>
                <p class="text-sm text-slate-500 mb-2">Cole o orçamento do parceiro. O sistema tentará cruzar os valores financeiros com os itens extraídos do PDF.</p>
                <textarea id="whatsapp-text" rows="6" class="w-full p-2 border rounded font-mono text-sm dark:bg-slate-700 dark:border-slate-600" placeholder="Ex: Porta 1. Prod: 350, Inst: 350..."></textarea>
                <div class="flex justify-end gap-3 mt-4">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded font-medium transition">Cancelar</button>
                    <button onclick="processarWhatsApp()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium transition">Processar Valores</button>
                </div>
            `;
            openModal(html);
        }

        function processarWhatsApp() {
            const text = document.getElementById('whatsapp-text').value;
            if(!text.trim()) { customAlert('Aviso', 'Cole o texto primeiro.'); return; }

            // Simulated matching based on user's previous data structure
            const simulatedPrices = {
                '1': { prod: 350, inst: 350 },
                '2.1': { prod: 120, inst: 200 },
                '2.2': { prod: 120, inst: 200 },
                '3.1': { prod: 350, inst: 300 },
                '3.2': { prod: 350, inst: 300 },
                '4': { prod: 350, inst: 350 },
                '5': { prod: 350, inst: 350 },
                '6': { prod: 250, inst: 260 },
                '7': { prod: 180, inst: 200 }
            };

            let updatedCount = 0;
            db.itens.forEach(item => {
                if (item.obraId === currentObraId && simulatedPrices[item.pid]) {
                    item.valor = item.etapa === 'Produção' ? simulatedPrices[item.pid].prod : simulatedPrices[item.pid].inst;
                    updatedCount++;
                }
            });

            closeModal();
            customAlert('Concluído', `Valores atualizados em ${updatedCount} registros! As métricas de R$/M² foram recalculadas.`);
            atualizarResumoFinancas();
            renderTabelaObra();
        }

        function modalItemManual() {
            const html = `
                <h3 class="text-xl font-bold mb-4 border-b pb-2 dark:border-slate-700">Adicionar Item Manual</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2"><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Descrição</label><input type="text" id="m-desc" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Identificador (Ex: 8.1)</label><input type="text" id="m-pid" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">Metragem (M²)</label><input type="number" step="0.01" id="m-m2" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">R$ Produção</label><input type="number" step="0.01" id="m-vprod" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                    <div><label class="text-sm font-bold text-slate-600 dark:text-slate-300">R$ Instalação</label><input type="number" step="0.01" id="m-vinst" class="w-full mt-1 p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded font-medium transition">Cancelar</button>
                    <button onclick="salvarItemManual()" class="px-4 py-2 bg-oppah-500 hover:bg-oppah-600 text-white rounded font-medium transition">Incluir Item</button>
                </div>
            `;
            openModal(html);
        }

        function salvarItemManual() {
            const desc = document.getElementById('m-desc').value;
            const pid = document.getElementById('m-pid').value || 'Avulso';
            const m2 = parseFloat(document.getElementById('m-m2').value) || 0;
            const vProd = parseFloat(document.getElementById('m-vprod').value) || 0;
            const vInst = parseFloat(document.getElementById('m-vinst').value) || 0;

            if(!desc) { customAlert('Erro', 'Descrição é obrigatória'); return; }

            db.itens.push({ id: generateId(), obraId: currentObraId, pid, desc, m2, etapa: 'Produção', valor: vProd, pago: false, data: '', obs: '' });
            db.itens.push({ id: generateId(), obraId: currentObraId, pid, desc, m2, etapa: 'Instalação', valor: vInst, pago: false, data: '', obs: '' });
            
            closeModal();
            atualizarResumoFinancas();
            renderTabelaObra();
        }

        function atualizarResumoFinancas() {
            const itens = db.itens.filter(i => i.obraId === currentObraId);
            
            let totalGeral = 0;
            let valPago = 0;
            let m2Total = 0;

            // To avoid summing m2 twice (prod + inst), calculate unique m2 based on original PID inserts
            const uniquePids = new Set();

            itens.forEach(i => {
                totalGeral += i.valor;
                if (i.pago) valPago += i.valor;
                
                // Only count M2 once per physical piece
                if (!uniquePids.has(i.pid + i.desc)) {
                    m2Total += i.m2;
                    uniquePids.add(i.pid + i.desc);
                }
            });

            const mediaGeral = m2Total > 0 ? (totalGeral / m2Total) : 0;
            const pendente = totalGeral - valPago;

            const html = `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase mb-1">Total da Obra</p>
                    <p class="text-xl font-bold text-slate-800 dark:text-slate-100">${formatMoney(totalGeral)}</p>
                </div>
                <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-200 dark:border-blue-800 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-blue-600 dark:text-blue-300 font-bold uppercase mb-1">Média (R$ / M² Total)</p>
                    <p class="text-xl font-bold text-blue-800 dark:text-blue-100">${formatMoney(mediaGeral)} <span class="text-sm font-normal">/m²</span></p>
                    <p class="text-xs text-blue-600 dark:text-blue-400 mt-1">Ref: ${m2Total.toFixed(2)} m² totais</p>
                </div>
                <div class="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-emerald-600 dark:text-emerald-300 font-bold uppercase mb-1">Total Pago ✅</p>
                    <p class="text-xl font-bold text-emerald-800 dark:text-emerald-100">${formatMoney(valPago)}</p>
                </div>
                <div class="bg-amber-50 dark:bg-amber-900/20 p-4 rounded-xl border border-amber-200 dark:border-amber-800 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-amber-600 dark:text-amber-300 font-bold uppercase mb-1">A Pagar ⏳</p>
                    <p class="text-xl font-bold text-amber-800 dark:text-amber-100">${formatMoney(pendente)}</p>
                </div>
            `;
            document.getElementById('resumo-financeiro').innerHTML = html;
        }

        function renderTabelaObra() {
            const tbody = document.getElementById('tabela-corpo');
            const itens = db.itens.filter(i => i.obraId === currentObraId);

            if (itens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-slate-500">Nenhum item lançado. Importe o PDF ou inclua manualmente.</td></tr>`;
                return;
            }

            let html = '';
            itens.forEach((item, index) => {
                const isProd = item.etapa === 'Produção';
                const rowClass = isProd ? "bg-white dark:bg-slate-800" : "bg-slate-50 dark:bg-slate-800/60";
                const stageColor = isProd ? "text-blue-600 dark:text-blue-400" : "text-purple-600 dark:text-purple-400";
                
                // R$/M² specific calculation
                const rm2 = item.m2 > 0 ? (item.valor / item.m2) : 0;
                
                let actionContent = '';
                if (item.pago) {
                    actionContent = `<span class="bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 px-3 py-1 rounded font-bold text-xs badge-print print-only">PAGO ✅</span>`;
                } else {
                    actionContent = `
                        <div class="flex gap-2 justify-center no-print">
                            <button id="btn-pay-${item.id}" onclick="processarPagamento('${item.id}')" ${!item.data ? 'disabled' : ''} class="${item.data ? 'bg-emerald-600 hover:bg-emerald-700 cursor-pointer' : 'bg-slate-300 dark:bg-slate-600 cursor-not-allowed'} text-white px-3 py-1.5 rounded text-sm font-bold transition">Pagar</button>
                            <button onclick="(() => {
                                const obsFn = function(val) { const i = db.itens.find(x => x.id === '${item.id}'); i.obs = val; renderTabelaObra(); };
                                customPrompt('Observação (${item.pid} - ${item.etapa})', '${item.obs}', obsFn);
                            })()" class="bg-slate-500 hover:bg-slate-600 text-white px-2 py-1.5 rounded" title="Anotação">📝</button>
                        </div>
                    `;
                }

                html += `
                    <tr class="${rowClass} hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <td class="p-3 font-medium whitespace-nowrap">${item.pid}</td>
                        <td class="p-3">
                            ${item.desc}
                            ${item.obs ? `<div class="text-xs text-amber-600 dark:text-amber-400 mt-1 italic">Obs: ${item.obs}</div>` : ''}
                        </td>
                        <td class="p-3 text-slate-500 dark:text-slate-400">${item.m2.toFixed(2)}</td>
                        <td class="p-3 font-bold ${stageColor}">${item.etapa}</td>
                        <td class="p-3 font-bold text-slate-700 dark:text-slate-200 whitespace-nowrap">${formatMoney(item.valor)}</td>
                        <td class="p-3 text-slate-500 dark:text-slate-400 whitespace-nowrap">${formatMoney(rm2)}<span class="text-xs">/m²</span></td>
                        <td class="p-3">
                            <input type="date" value="${item.data}" onchange="liberarPagamento('${item.id}', this.value)" class="p-1.5 border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700 focus:outline-none text-sm w-full max-w-[130px] ${item.pago ? 'opacity-70 pointer-events-none' : ''}">
                        </td>
                        <td class="p-3 text-center align-middle">${actionContent}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function liberarPagamento(id, dateValue) {
            const item = db.itens.find(i => i.id === id);
            if(item) {
                item.data = dateValue;
                const btn = document.getElementById(`btn-pay-${id}`);
                if (btn) {
                    if (dateValue) {
                        btn.disabled = false;
                        btn.classList.remove('bg-slate-300', 'dark:bg-slate-600', 'cursor-not-allowed');
                        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'cursor-pointer');
                    } else {
                        btn.disabled = true;
                        btn.classList.add('bg-slate-300', 'dark:bg-slate-600', 'cursor-not-allowed');
                        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'cursor-pointer');
                    }
                }
            }
        }

        function processarPagamento(id) {
            const item = db.itens.find(i => i.id === id);
            if (item) {
                item.pago = true;
                atualizarResumoFinancas();
                renderTabelaObra();
            }
        }

        // --- Start App ---
        window.onload = function() {
            initTheme();
            renderDashboard();
        }
    </script>
</body>
</html>
