<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Oppah - Dashboard</title>
    
    <script>
        window.tailwind = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { oppah: { 500: '#3182ce', 600: '#2b6cb0', 900: '#1a202c' } }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Modal Transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms ease-out, transform 200ms ease-out; }
        
        /* Custom Scrollbar for tables */
        .table-container { max-height: 500px; overflow-y: auto; }
        .table-container thead th { position: sticky; top: 0; z-index: 10; }
        
        /* Print Styles - Crucial to hide the Portal UI and only show the Module Content */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; margin: 0 !important; padding: 0 !important; }
            #portal-main-wrapper { margin: 0 !important; padding: 0 !important; width: 100% !important; overflow: visible !important; }
            main { box-shadow: none !important; border: none !important; padding: 0 !important; }
            input[type="date"] { border: none !important; background: transparent !important; color: black !important; padding: 0 !important; font-family: inherit !important; }
            table, th, td { border-collapse: collapse !important; border: 1px solid #cbd5e0 !important; }
            th { background-color: #f7fafc !important; color: black !important; }
            .badge-print { border: 1px solid #38a169; padding: 2px 5px; border-radius: 4px; color: #38a169; }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-200 flex h-screen overflow-hidden">

    <!-- Sidebar (Portal Oppah Navigation) -->
    <aside class="w-64 bg-slate-900 dark:bg-slate-950 text-slate-300 flex-col hidden md:flex no-print shadow-xl z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <div class="w-8 h-8 bg-oppah-500 rounded-lg flex items-center justify-center text-white font-bold text-lg mr-3 shadow-inner">O</div>
            <span class="text-xl font-bold text-white tracking-wide">Portal Oppah</span>
        </div>
        
        <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
            <a href="#" id="nav-inicio" onclick="navigateTo('inicio')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Início
            </a>
            <a href="#" id="nav-corte" onclick="navigateTo('corte')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                Corte Oficina
            </a>
            <!-- Active Module Indicator -->
            <a href="#" id="nav-terceirizacoes" onclick="navigateTo('terceirizacoes')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-oppah-600 text-white shadow-md transition border-l-4 border-amber-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Terceirizações
            </a>
            <a href="#" id="nav-relatorios" onclick="navigateTo('relatorios')" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Relatórios
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">AD</div>
                <div class="text-sm">
                    <p class="text-white font-medium">Admin Oppah</p>
                    <p class="text-xs text-slate-500">admin@oppah.com</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div id="portal-main-wrapper" class="flex-1 flex flex-col h-full overflow-hidden relative">
        
        <!-- Topbar -->
        <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 lg:px-8 no-print shadow-sm z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-500 hover:text-slate-800 dark:hover:text-white transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h2 id="module-title" class="text-xl font-bold text-slate-800 dark:text-white hidden sm:block">Módulo de Acertos</h2>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Theme Toggle Button -->
                <button onclick="toggleDarkMode()" id="theme-toggle" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition shadow-sm border border-slate-200 dark:border-slate-600" title="Alternar Tema">
                    <!-- Icon updated via JS -->
                </button>
            </div>
        </header>

        <!-- Dynamic Module Content Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 w-full bg-slate-50 dark:bg-slate-900">
            <div class="max-w-7xl mx-auto">
                
                <!-- THE MODULE COMPONENT (Terceirizações) -->
                <div id="app-content" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 min-h-[70vh]">
                    <!-- Rendered dynamically by JS -->
                </div>

            </div>
        </main>
    </div>

    <!-- Reusable Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-lg border border-slate-200 dark:border-slate-700 p-6 transform transition-all">
            <!-- Modal body goes here -->
        </div>
    </div>

    <!-- Custom Alert Overlay -->
    <div id="alert-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-sm border border-slate-200 dark:border-slate-700 p-6 text-center transform transition-all">
            <h3 id="alert-title" class="text-lg font-bold mb-2">Mensagem</h3>
            <p id="alert-message" class="text-slate-600 dark:text-slate-300 mb-6"></p>
            <button onclick="closeAlert()" class="bg-oppah-500 hover:bg-oppah-600 text-white font-medium py-2 px-6 rounded-lg transition shadow-md">OK, entendi</button>
        </div>
    </div>

    <script>
        // PDF.js configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // --- Simulated Database ---
        let db = {
            terceirizados: [],
            obras: [],
            itens: []
        };
        
        let currentView = 'dashboard'; 
        let currentTerceirizadoId = null;
        let currentObraId = null;

        // --- Utilities ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);

        // --- Navigation Router (Single Page App) ---
        function navigateTo(moduleName) {
            /* 1. Atualiza visual do menu lateral */
            const navLinks = ['inicio', 'corte', 'terceirizacoes', 'relatorios'];
            navLinks.forEach(id => {
                const el = document.getElementById(`nav-${id}`);
                if (el) {
                    el.classList.remove('bg-oppah-600', 'text-white', 'shadow-md', 'border-l-4', 'border-amber-400');
                    el.classList.add('hover:bg-slate-800', 'hover:text-white', 'text-slate-300');
                }
            });

            const activeLink = document.getElementById(`nav-${moduleName}`);
            if (activeLink) {
                activeLink.classList.remove('hover:bg-slate-800', 'hover:text-white', 'text-slate-300');
                activeLink.classList.add('bg-oppah-600', 'text-white', 'shadow-md', 'border-l-4', 'border-amber-400');
            }

            /* 2. Atualiza o Título e o Conteúdo da Tela */
            const title = document.getElementById('module-title');
            const container = document.getElementById('app-content');

            if (moduleName === 'terceirizacoes') {
                title.innerText = 'Módulo de Acertos';
                renderDashboard(); // Chama a função que constrói a tela de Terceirizados
            } 
            else if (moduleName === 'inicio') {
                title.innerText = 'Visão Geral';
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-24 text-center">
                        <div class="w-20 h-20 bg-white dark:bg-slate-800 rounded-full flex items-center justify-center text-4xl mb-6 shadow-sm border border-slate-200 dark:border-slate-700">🏠</div>
                        <h2 class="text-3xl font-bold text-slate-800 dark:text-white mb-3">Bem-vindo ao Portal Oppah</h2>
                        <p class="text-slate-500 dark:text-slate-400 max-w-md text-lg">Selecione o módulo de <strong>Terceirizações</strong> no menu lateral para testar o painel que acabamos de construir.</p>
                    </div>
                `;
            } 
            else {
                title.innerText = 'Em Desenvolvimento';
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-24 text-center">
                        <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-4xl mb-6 shadow-sm border border-slate-200 dark:border-slate-700">🚧</div>
                        <h2 class="text-3xl font-bold text-slate-800 dark:text-white mb-3">Módulo em Construção</h2>
                        <p class="text-slate-500 dark:text-slate-400 max-w-md text-lg">Esta área do sistema está sendo desenvolvida e estará disponível em breve.</p>
                    </div>
                `;
            }
        }

        // --- Theme Logic ---
        function initTheme() {
            let savedTheme = null;
            try { 
                savedTheme = localStorage.getItem('oppah_theme'); 
            } catch(e) { 
                console.log('Storage blocked, using system preference.'); 
            }
            
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const html = document.documentElement;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            
            try { 
                localStorage.setItem('oppah_theme', isDark ? 'dark' : 'light'); 
            } catch(e) {
                console.log('Could not save theme to storage.');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const btn = document.getElementById('theme-toggle');
            if(btn) {
                btn.innerHTML = isDark 
                    ? `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`
                    : `<svg class="w-5 h-5 text-slate-700" fill="currentColor" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>`;
            }
        }

        // --- Print Logic (Forces light mode to save ink) ---
        window.addEventListener('beforeprint', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('temp-light');
            }
        });
        window.addEventListener('afterprint', () => {
            if (document.documentElement.classList.contains('temp-light')) {
                document.documentElement.classList.remove('temp-light');
                document.documentElement.classList.add('dark');
            }
        });

        function openModal(contentHtml) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = contentHtml;
            overlay.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        function customAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-overlay').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('alert-overlay').classList.add('hidden');
        }

        function customPrompt(title, defaultValue, callback) {
            const html = `
                <h3 class="text-lg font-bold mb-4 text-slate-800 dark:text-white">${title}</h3>
                <input type="text" id="prompt-input" value="${defaultValue || ''}" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-oppah-500 mb-6">
                <div class="flex justify-end gap-3">
                    <button onclick="closeModal()" class="px-4 py-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition font-medium">Cancelar</button>
                    <button onclick="(() => { const val = document.getElementById('prompt-input').value; closeModal(); ${callback.name}(val); })()" class="px-5 py-2 bg-oppah-500 hover:bg-oppah-600 text-white rounded-lg transition shadow-md font-medium">Salvar</button>
                </div>
            `;
            openModal(html);
        }

        // NOVO: Função para o Modal de Confirmação de Exclusão
        function customConfirm(title, message, actionCode) {
            const html = `
                <div class="text-center">
                    <div class="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 text-red-500 mx-auto flex items-center justify-center mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h3 class="text-xl font-bold mb-2 text-slate-800 dark:text-white">${title}</h3>
                    <p class="text-slate-600 dark:text-slate-400 mb-6">${message}</p>
                    <div class="flex justify-center gap-3">
                        <button onclick="closeModal()" class="px-5 py-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg font-medium transition">Cancelar</button>
                        <button onclick="closeModal(); ${actionCode}" class="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-lg font-medium shadow-md transition">Sim, Excluir</button>
                    </div>
                </div>
            `;
            openModal(html);
        }

        function renderDashboard() {
            currentTerceirizadoId = null;
            currentObraId = null;
            const container = document.getElementById('app-content');
            
            let html = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Gestão de Terceirizados</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Gerencie os parceiros de produção e instalação.</p>
                    </div>
                    <button onclick="modalNovoTerceirizado()" class="no-print bg-oppah-500 hover:bg-oppah-600 text-white px-5 py-2.5 rounded-lg font-medium transition shadow-md flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Novo Terceirizado
                    </button>
                </div>
            `;

            if (db.terceirizados.length === 0) {
                html += `<div class="text-center py-16 bg-slate-50 dark:bg-slate-700/30 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600">
                    <svg class="w-16 h-16 text-slate-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <p class="text-slate-500 dark:text-slate-400 text-lg font-medium">Nenhum prestador de serviço cadastrado.</p>
                    <p class="text-slate-400 dark:text-slate-500 text-sm mt-1 mb-4">Adicione o primeiro terceirizado para começar a controlar as obras.</p>
                    <button onclick="modalNovoTerceirizado()" class="text-oppah-500 font-bold hover:underline">Cadastrar Parceiro Agora &rarr;</button>
                </div>`;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">`;
                db.terceirizados.forEach(t => {
                    const qtdObras = db.obras.filter(o => o.terceirizadoId === t.id).length;
                    html += `
                        <div class="p-5 border border-slate-200 dark:border-slate-700 rounded-xl hover:shadow-lg hover:-translate-y-1 transition-all bg-white dark:bg-slate-800 cursor-pointer flex flex-col" onclick="renderObras('${t.id}')">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-xl shadow-inner border border-slate-200 dark:border-slate-600">👤</div>
                                <div>
                                    <h3 class="font-bold text-lg text-slate-800 dark:text-white leading-tight">${t.empresa}</h3>
                                    <span class="text-xs font-medium text-oppah-500 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded border border-blue-100 dark:border-blue-800">${qtdObras} Obras ativas</span>
                                </div>
                            </div>
                            <div class="text-sm text-slate-600 dark:text-slate-400 space-y-2 mb-4 flex-grow bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                <p class="flex items-center gap-2"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> ${t.responsavel}</p>
                                <p class="flex items-center gap-2"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg> ${t.telefone || 'Não informado'}</p>
                            </div>
                            <div class="flex justify-between items-center border-t border-slate-100 dark:border-slate-700 pt-3">
                                <span class="text-xs text-slate-500">Clique para acessar</span>
                                <span class="text-oppah-500 text-sm font-bold flex items-center gap-1">Painel <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function modalNovoTerceirizado() {
            const html = `
                <h3 class="text-xl font-bold mb-4 border-b pb-3 dark:border-slate-700 text-slate-800 dark:text-white">Cadastrar Terceirizado</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Nome da Empresa / Parceiro *</label>
                        <input type="text" id="t-empresa" placeholder="Ex: Esquadrias P&P" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-oppah-500 focus:ring-1 focus:ring-oppah-500">
                    </div>
                    <div>

        async function importarPDF() {
            const fileInput = document.getElementById('pdf-upload');
            if (fileInput.files.length === 0) {
                customAlert('Atenção', 'Selecione um arquivo PDF primeiro.');
                return;
            }

            const file = fileInput.files[0];
            const fileReader = new FileReader();

            fileReader.onload = async function() {
                const extractedItens = [
                    { pid: '1', desc: 'PORTA DE GIRO 01 FOLHA | LINHA 42', m2: 2.10 },
                    { pid: '2.1', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', m2: 0.85 },
                    { pid: '2.2', desc: 'MAXIM-AR COM 01 MÓDULO | GOLD', m2: 0.85 },
                    { pid: '3.1', desc: 'JANELA DE CORRER INTEGRADA 02 FOLHAS', m2: 3.20 },
                    { pid: '3.2', desc: 'JANELA DE CORRER INTEGRADA 02 FOLHAS', m2: 3.20 },
                    { pid: '4', desc: 'MAXIM-AR E FIXO 02 MOD. HORIZONTAIS', m2: 1.50 },
                    { pid: '5', desc: 'PORTA DE CORRER 03 FOLHAS MÓVEIS', m2: 6.00 },
                    { pid: '6', desc: 'PORTA DE CORRER 02 FOLHAS MÓVEIS', m2: 4.50 },
                    { pid: '7', desc: 'JANELA DE CORRER 04 FOLHAS', m2: 2.80 }
                ];

                extractedItens.forEach(item => {
                    db.itens.push({ id: generateId(), obraId: currentObraId, pid: item.pid, desc: item.desc, m2: item.m2, etapa: 'Produção', valor: 0, pago: false, data: '', obs: '' });

                });

                customAlert('Sucesso!', `${extractedItens.length} peças extraídas da OS com sucesso (incluindo metragens). Agora prossiga para o Passo 2 e cole os valores do WhatsApp.`);
                atualizarResumoFinancas();
                renderTabelaObra();
            };
            fileReader.readAsArrayBuffer(file);
        }

                <div class="flex justify-end gap-3 mt-5">
                    <button onclick="closeModal()" class="px-5 py-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg font-medium transition">Cancelar</button>
                    <button onclick="processarWhatsApp()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium shadow-md transition">Processar e Cruzar Dados</button>
                </div>
            `;
            openModal(html);
        }

        function processarWhatsApp() {
            const text = document.getElementById('whatsapp-text').value;
            if(!text.trim()) { customAlert('Aviso', 'A caixa de texto está vazia. Cole o conteúdo primeiro.'); return; }

            const simulatedPrices = {
                '1': { prod: 350, inst: 350 },
                '2.1': { prod: 120, inst: 200 },
                '2.2': { prod: 120, inst: 200 },
                '3.1': { prod: 350, inst: 300 },
                '3.2': { prod: 350, inst: 300 },
                '4': { prod: 350, inst: 350 },
                '5': { prod: 350, inst: 350 },
                '6': { prod: 250, inst: 260 },
                '7': { prod: 180, inst: 200 }
            };

            let updatedCount = 0;
            db.itens.forEach(item => {
                if (item.obraId === currentObraId && simulatedPrices[item.pid]) {
                    item.valor = item.etapa === 'Produção' ? simulatedPrices[item.pid].prod : simulatedPrices[item.pid].inst;
                    updatedCount++;
                }
            });

            closeModal();
            customAlert('Operação Concluída', `Valores atualizados em ${updatedCount} registros com sucesso! As métricas de R$/M² foram recalculadas automaticamente.`);
            atualizarResumoFinancas();
            renderTabelaObra();
        }

        function modalItemManual() {
            const html = `
                <h3 class="text-xl font-bold mb-4 border-b pb-3 dark:border-slate-700 text-slate-800 dark:text-white">Adicionar Item Manual</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Descrição da Peça *</label>
                        <input type="text" id="m-desc" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-oppah-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Cód (Ex: 8.1)</label>
                        <input type="text" id="m-pid" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-oppah-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Metragem (M²)</label>
                        <input type="number" step="0.01" id="m-m2" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-oppah-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">R$ Produção</label>
                        <input type="number" step="0.01" id="m-vprod" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-oppah-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">R$ Instalação</label>
                        <input type="number" step="0.01" id="m-vinst" class="w-full p-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-oppah-500">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-slate-100 dark:border-slate-700">
                    <button onclick="closeModal()" class="px-5 py-2.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg font-medium transition">Cancelar</button>
                    <button onclick="salvarItemManual()" class="px-5 py-2.5 bg-oppah-500 hover:bg-oppah-600 text-white rounded-lg font-medium shadow-md transition">Incluir na Obra</button>
                </div>
            `;
            openModal(html);
        }

        function salvarItemManual() {
            const desc = document.getElementById('m-desc').value;
            const pid = document.getElementById('m-pid').value || 'Avulso';
            const m2 = parseFloat(document.getElementById('m-m2').value) || 0;
            const vProd = parseFloat(document.getElementById('m-vprod').value) || 0;
            const vInst = parseFloat(document.getElementById('m-vinst').value) || 0;

            if(!desc) { customAlert('Aviso', 'A Descrição da peça é obrigatória.'); return; }

            db.itens.push({ id: generateId(), obraId: currentObraId, pid, desc, m2, etapa: 'Produção', valor: vProd, pago: false, data: '', obs: '' });
            db.itens.push({ id: generateId(), obraId: currentObraId, pid, desc, m2, etapa: 'Instalação', valor: vInst, pago: false, data: '', obs: '' });
            
            closeModal();
            atualizarResumoFinancas();
            renderTabelaObra();
        }

        // NOVO: Função para processar a exclusão de um item
        function excluirItem(id) {
            db.itens = db.itens.filter(i => i.id !== id);
            atualizarResumoFinancas();
            renderTabelaObra();
        }

        function atualizarResumoFinancas() {
            const itens = db.itens.filter(i => i.obraId === currentObraId);
            
            let totalGeral = 0;
            let valPago = 0;
            let m2Total = 0;

            const uniquePids = new Set();

            itens.forEach(i => {
                totalGeral += i.valor;
                if (i.pago) valPago += i.valor;
                
                // Only count M2 once per physical piece (avoid double counting prod+inst)
                if (!uniquePids.has(i.pid + i.desc)) {
                    m2Total += i.m2;
                    uniquePids.add(i.pid + i.desc);
                }
            });

            const mediaGeral = m2Total > 0 ? (totalGeral / m2Total) : 0;
            const pendente = totalGeral - valPago;

            const html = `
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider mb-1">Total da Obra</p>
                    <p class="text-2xl font-black text-slate-800 dark:text-white">${formatMoney(totalGeral)}</p>
                </div>
                <div class="bg-blue-50 dark:bg-blue-900/30 p-4 rounded-xl border border-blue-200 dark:border-blue-800/60 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-blue-600 dark:text-blue-400 font-bold uppercase tracking-wider mb-1">Média M² Total</p>
                    <p class="text-2xl font-black text-blue-700 dark:text-blue-300">${formatMoney(mediaGeral)} <span class="text-sm font-normal text-blue-600/70 dark:text-blue-400/70">/m²</span></p>
                    <p class="text-[10px] uppercase font-bold text-blue-500/70 dark:text-blue-400/50 mt-1">Ref: ${m2Total.toFixed(2)} m²</p>
                </div>
                <div class="bg-emerald-50 dark:bg-emerald-900/30 p-4 rounded-xl border border-emerald-200 dark:border-emerald-800/60 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider mb-1">Total Pago</p>
                    <p class="text-2xl font-black text-emerald-700 dark:text-emerald-300">${formatMoney(valPago)}</p>
                </div>
                <div class="bg-amber-50 dark:bg-amber-900/30 p-4 rounded-xl border border-amber-200 dark:border-amber-800/60 shadow-sm flex flex-col justify-center">
                    <p class="text-xs text-amber-600 dark:text-amber-400 font-bold uppercase tracking-wider mb-1">Restante a Pagar</p>
                    <p class="text-2xl font-black text-amber-700 dark:text-amber-300">${formatMoney(pendente)}</p>
                </div>
            `;
            document.getElementById('resumo-financeiro').innerHTML = html;
        }

        function renderTabelaObra() {
            const tbody = document.getElementById('tabela-corpo');
            const itens = db.itens.filter(i => i.obraId === currentObraId);

            if (itens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50">Nenhum item lançado nesta obra.<br>Utilize os painéis acima para importar o PDF ou adicionar manualmente.</td></tr>`;
                return;
            }

            let html = '';
            itens.forEach((item) => {
                const isProd = item.etapa === 'Produção';
                const stageColor = isProd ? "text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 border-blue-100 dark:border-blue-800/30" : "text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20 border-purple-100 dark:border-purple-800/30";
                
                const rm2 = item.m2 > 0 ? (item.valor / item.m2) : 0;
                
                let actionContent = '';
                if (item.pago) {
                    actionContent = `<span class="bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-md font-bold text-xs badge-print border border-emerald-200 dark:border-emerald-800 flex items-center justify-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg> PAGO</span>`;
                } else {
                    actionContent = `
                        <div class="flex gap-2 justify-center no-print">
                            <button id="btn-pay-${item.id}" onclick="processarPagamento('${item.id}')" ${!item.data ? 'disabled' : ''} class="${item.data ? 'bg-emerald-600 hover:bg-emerald-700 cursor-pointer shadow-sm' : 'bg-slate-300 dark:bg-slate-700 text-slate-500 dark:text-slate-400 cursor-not-allowed'} text-white px-4 py-1.5 rounded-lg text-sm font-bold transition">Pagar</button>
                            <button onclick="(() => {
                                const obsFn = function(val) { const i = db.itens.find(x => x.id === '${item.id}'); i.obs = val; renderTabelaObra(); };
                                customPrompt('Anotação interna (${item.pid} - ${item.etapa})', '${item.obs}', obsFn);
                            })()" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg transition" title="Adicionar Anotação"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            
                            <!-- NOVO: Botão de Lixeira na Tabela de Itens -->
                            <button onclick="customConfirm('Excluir Item', 'Deseja remover a etapa de ${item.etapa} deste item? O valor será subtraído do total.', 'excluirItem(\\'${item.id}\\')')" class="bg-slate-200 hover:bg-red-100 dark:bg-slate-700 dark:hover:bg-red-900/40 text-slate-600 hover:text-red-600 dark:text-slate-300 dark:hover:text-red-400 px-3 py-1.5 rounded-lg transition" title="Excluir Item"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    `;
                }

                html += `
                    <tr class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
                        <td class="p-4 font-bold text-slate-700 dark:text-slate-300 whitespace-nowrap">${item.pid}</td>
                        <td class="p-4 text-slate-800 dark:text-slate-200 font-medium">
                            ${item.desc}
                            ${item.obs ? `<div class="text-xs text-amber-600 dark:text-amber-400 mt-1.5 bg-amber-50 dark:bg-amber-900/20 p-1.5 rounded border border-amber-100 dark:border-amber-800/50 inline-block">📝 Obs: ${item.obs}</div>` : ''}
                        </td>
                        <td class="p-4 text-slate-500 dark:text-slate-400">${item.m2.toFixed(2)}</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-md text-xs font-bold border ${stageColor}">${item.etapa}</span>
                        </td>
                        <td class="p-4 font-bold text-slate-800 dark:text-white whitespace-nowrap text-right">${formatMoney(item.valor)}</td>
                        <td class="p-4 text-slate-500 dark:text-slate-400 whitespace-nowrap text-right text-xs">${formatMoney(rm2)}/m²</td>
                        <td class="p-4 text-center">
                            <input type="date" value="${item.data}" onchange="liberarPagamento('${item.id}', this.value)" class="p-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-oppah-500 text-sm w-full max-w-[140px] ${item.pago ? 'opacity-50 pointer-events-none' : ''}">
                        </td>
                        <td class="p-4 text-center align-middle">${actionContent}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function liberarPagamento(id, dateValue) {
            const item = db.itens.find(i => i.id === id);
            if(item) {
                item.data = dateValue;
                const btn = document.getElementById(`btn-pay-${id}`);
                if (btn) {
                    if (dateValue) {
                        btn.disabled = false;
                        btn.classList.remove('bg-slate-300', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-400', 'cursor-not-allowed');
                        btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'text-white', 'cursor-pointer', 'shadow-sm');
                    } else {
                        btn.disabled = true;
                        btn.classList.add('bg-slate-300', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-400', 'cursor-not-allowed');
                        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'text-white', 'cursor-pointer', 'shadow-sm');
                    }
                }
            }
        }

        function processarPagamento(id) {
            const item = db.itens.find(i => i.id === id);
            if (item) {
                item.pago = true;
                atualizarResumoFinancas();
                renderTabelaObra();
            }
        }

        // --- Start App ---
        window.onload = function() {
            initTheme();
            navigateTo('terceirizacoes'); // Define qual tela abre por padrão quando acessa o portal
        }
    </script>
</body>
</html>
